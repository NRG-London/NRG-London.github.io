name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # A phone notification (ntfy) for every publish, from the PC or from NRG-1,
  # with the commit message; a failed build or deploy is flagged instead.
  # The topic is the repo secret NTFY_TOPIC (the same one NRG-1's alerts use).
  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESULT: ${{ needs.deploy.result }}
          MESSAGE: ${{ github.event.head_commit.message || 'Manual run' }}
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          if [ "$RESULT" = success ]; then
            title="neilgarratt.com updated ($AUTHOR)"; tags=globe_with_meridians; prio=default; click=https://neilgarratt.com/
          else
            title="neilgarratt.com update FAILED ($AUTHOR)"; tags=warning; prio=high; click=$RUN_URL
          fi
          curl -s -o /dev/null -H "Title: $title" -H "Tags: $tags" -H "Priority: $prio" \
            -H "Click: $click" -d "$MESSAGE" "https://ntfy.sh/$NTFY_TOPIC"
