{{- /*
  Crime Hotspots — embeds the deck.gl 3D "70-metre hex" hotspots map (8 switchable
  crime types, plus a Boroughs/Street basemap toggle) via an isolated <iframe>, with
  a static hero-image fallback for browsers without WebGL2 or JavaScript. Sibling of
  crime-skyline.html — same frame / fallback / full-screen machinery, different viz.
    - Breaks WIDE out of the 800px article column by default (~80vw on desktop,
      full-bleed on mobile); height tracks the viz's native ~1.865:1 box.
    - "Full screen" big mode: CSS fixed-overlay + best-effort native Fullscreen;
      toggling does NOT reload the iframe (preserves crime type, mode, camera).
    - Controls live in a toolbar BELOW the frame — the viz uses all four corners.
    - EXCEPT full screen and download, which are inside the frame, top right:
      the viz moved its hint down to make room. Full screen still runs HERE —
      the CSS overlay is what works on tablets where iframe fullscreen is flaky —
      so the in-frame button asks for it by postMessage and this listens. The
      state is posted back, because Esc exits without the iframe ever hearing.
    - There is no ✕ Close any more. It sat in the same corner as the frame's own
      two buttons and covered both of them in big mode — including the one that
      exits. Esc remains wired here as the belt to that braces.
    - The iframe is loading="lazy": the embed is ~10 MB (data inlined) and sits
      below the skyline, so it only fetches once the reader scrolls to it.
  Interactive: static/interactive/crime-hotspots/index.html  (deck.gl 9.3.7, WebGL2)
  Needs:       static/js/deck.min.js, static/js/maplibre-gl.js,
               static/fonts/{DMSans,LibreBaskerville}.ttf (all shared with crime-skyline)
  Fallback:    static/images/charts/crime-concentration/crime-hotspots-hero.png
  Note:        the Map button cycles Boroughs -> Street -> Dark. Boroughs still makes
               ZERO external calls — maplibre-gl.js is same-origin and no basemap is
               mounted. The two opt-in basemaps are CARTO VECTOR (MapLibre draws them
               under deck.gl's canvas), so they fetch a style JSON, vector tiles, glyph
               PBFs and a sprite from basemaps.cartocdn.com. Attributed in-page.
  Usage: {{< crime-hotspots >}}
  NB: ?v=N is a manual cache-buster; bump it whenever the interactive changes.
*/ -}}
<style>
  html{overflow-x:hidden;overflow-x:clip}
  .crime-hotspots{width:80vw;margin:2rem 0;margin-left:calc(50% - 40vw)}
  .crime-hotspots .cs-box{position:relative;width:100%;height:min(42.9vw,82vh);background:#1A2332;overflow:hidden}
  .crime-hotspots .cs-box>iframe,.crime-hotspots .cs-box>img{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .crime-hotspots .cs-box>img{object-fit:contain}
  .crime-hotspots .cs-bar{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;max-width:800px;margin:.6rem auto 0;padding:0 2rem;font-size:.85rem;color:#5a6472}
  .crime-hotspots .cs-btn{font:600 .8rem var(--sans,sans-serif);color:#243142;background:#fff;border:1px solid #c9d2cc;border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap;line-height:1}
  .crime-hotspots .cs-btn:hover{background:#f3f6f4;border-color:#243142}
  .crime-hotspots.cs-big{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;margin:0;z-index:9999;background:#1A2332}
  .crime-hotspots.cs-big .cs-box{height:100%}
  .crime-hotspots.cs-big .cs-bar{display:none}
  @media (max-width:700px){.crime-hotspots{width:100vw;margin-left:calc(50% - 50vw)}.crime-hotspots .cs-box{height:min(125vw,72vh)}}
</style>
<figure class="crime-hotspots" id="crime-hotspots">
  <div class="cs-box">
    <img src="/images/charts/crime-concentration/crime-hotspots-hero.png?v=1"
         alt="3D hex map of London theft-from-the-person hotspots — crime concentrates on a handful of streets even inside the hottest wards."
         loading="lazy">
  </div>
  <div class="cs-bar">
    <span>London crime hotspots &mdash; 70&nbsp;m hexes, 2021&ndash;2025 &mdash; drag to rotate and tilt; switch crime type, and toggle the Boroughs/Street basemap, with the buttons. Full screen and download are in the top right of the map.</span>
  </div>
</figure>
<script>
(function(){
  var fig=document.getElementById('crime-hotspots'); if(!fig) return;
  var box=fig.querySelector('.cs-box');
  var ok=false; try{ ok=!!(window.WebGL2RenderingContext && document.createElement('canvas').getContext('webgl2')); }catch(e){}
  if(ok){
    var f=document.createElement('iframe');
    f.loading='lazy';                       // ~10 MB embed below the fold — defer until scrolled to
    f.src='/interactive/crime-hotspots/?v=5';
    f.title='Interactive 3D hex map of London crime hotspots';
    f.setAttribute('scrolling','no'); f.setAttribute('allow','fullscreen'); f.setAttribute('allowfullscreen','');
    box.insertBefore(f, box.firstChild);
    box.querySelector('img').style.display='none';
  }
  function enter(){
    fig.classList.add('cs-big'); document.body.style.overflow='hidden';
    if(fig.requestFullscreen){ fig.requestFullscreen().catch(function(){}); }
  }
  function exit(){
    fig.classList.remove('cs-big'); document.body.style.overflow='';
    if(document.fullscreenElement){ document.exitFullscreen().catch(function(){}); }
  }
  // The frame asks; this answers, and says what it did. Same-origin only, only
  // for the two messages we know, and only from THIS figure's own iframe. The
  // last test is not belt and braces: the crime-concentration page carries two
  // maps, and without it both shortcodes answered either map's button, so both
  // figures went big and the skyline, requesting native fullscreen first, won —
  // the hex map's button showed the wards.
  function tell(){
    var f=box.querySelector('iframe');
    if(f&&f.contentWindow){
      try{ f.contentWindow.postMessage(
        {type:'ng-viz:fullscreen-state',big:fig.classList.contains('cs-big')},
        location.origin); }catch(e){}
    }
  }
  window.addEventListener('message',function(e){
    var own=box.querySelector('iframe');
    if(e.origin!==location.origin||!e.data||!own||e.source!==own.contentWindow) return;
    if(e.data.type==='ng-viz:fullscreen'){ enter(); tell(); }
    else if(e.data.type==='ng-viz:exit-fullscreen'){ exit(); tell(); }
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&fig.classList.contains('cs-big')){ exit(); tell(); } });
  document.addEventListener('fullscreenchange',function(){ if(!document.fullscreenElement&&fig.classList.contains('cs-big')){ exit(); tell(); } });
})();
</script>
