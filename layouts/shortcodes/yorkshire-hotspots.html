{{- /*
  Yorkshire Hotspots — embeds the deck.gl 3D "70-metre hex" hotspots map for the
  four forces of Yorkshire and the Humber (8 switchable crime types, a
  Districts/Street basemap toggle, and Whole region/Leeds/Bradford/Sheffield/
  York/Hull camera presets) via an isolated <iframe>, with a static hero-image
  fallback for browsers without WebGL2 or JavaScript.

  Sibling of crime-hotspots.html — same frame / fallback / full-screen machinery,
  different region. Kept as a separate shortcode rather than parameterising the
  London one, so the live crime-concentration campaign page cannot be affected.
    - Breaks WIDE out of the 800px article column by default (~80vw on desktop,
      full-bleed on mobile); height tracks the viz's native ~1.865:1 box.
    - "Full screen" big mode: CSS fixed-overlay + best-effort native Fullscreen;
      toggling does NOT reload the iframe (preserves crime type, mode, camera).
    - Controls live in a toolbar BELOW the frame — the viz uses all four corners.
    - The iframe is loading="lazy": the embed is ~7.4 MB (data inlined).
  Interactive: static/interactive/yorkshire-hotspots/index.html  (deck.gl 9.3.7, WebGL2)
  Needs:       static/js/deck.min.js, static/fonts/{DMSans,LibreBaskerville}.ttf
               (already deployed — shared with crime-skyline and crime-hotspots)
  Fallback:    static/images/charts/yorkshire-hotspots/yorkshire-hotspots-hero.png
  Note:        default Districts mode makes zero external calls (verified with all
               DNS blackholed); the opt-in Street basemap fetches CARTO tiles
               (basemaps.cartocdn.com), attributed in-page.
  Usage: {{< yorkshire-hotspots >}}
  NB: ?v=N is a manual cache-buster; bump it whenever the interactive changes.
*/ -}}
<style>
  html{overflow-x:hidden;overflow-x:clip}
  .yorkshire-hotspots{width:80vw;margin:2rem 0;margin-left:calc(50% - 40vw)}
  .yorkshire-hotspots .cs-box{position:relative;width:100%;height:min(42.9vw,82vh);background:#1A2332;overflow:hidden}
  .yorkshire-hotspots .cs-box>iframe,.yorkshire-hotspots .cs-box>img{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .yorkshire-hotspots .cs-box>img{object-fit:contain}
  .yorkshire-hotspots .cs-bar{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;max-width:800px;margin:.6rem auto 0;padding:0 2rem;font-size:.85rem;color:#5a6472}
  .yorkshire-hotspots .cs-btn{font:600 .8rem var(--sans,sans-serif);color:#243142;background:#fff;border:1px solid #c9d2cc;border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap;line-height:1}
  .yorkshire-hotspots .cs-btn:hover{background:#f3f6f4;border-color:#243142}
  .yorkshire-hotspots .cs-close{position:absolute;top:12px;right:12px;z-index:5;display:none;align-items:center;color:#F3F6F4;background:rgba(36,49,66,.9);border-color:#3B4A5E}
  .yorkshire-hotspots .cs-close:hover{background:#34455C;border-color:#5A9FD4}
  .yorkshire-hotspots.cs-big{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;margin:0;z-index:9999;background:#1A2332}
  .yorkshire-hotspots.cs-big .cs-box{height:100%}
  .yorkshire-hotspots.cs-big .cs-bar{display:none}
  .yorkshire-hotspots.cs-big .cs-close{display:inline-flex}
  @media (max-width:700px){.yorkshire-hotspots{width:100vw;margin-left:calc(50% - 50vw)}.yorkshire-hotspots .cs-box{height:min(125vw,72vh)}}
</style>
<figure class="yorkshire-hotspots" id="yorkshire-hotspots">
  <div class="cs-box">
    <img src="/images/charts/yorkshire-hotspots/yorkshire-hotspots-hero.png?v=2"
         alt="3D hex map of shoplifting across Yorkshire and the Humber — the offences pile onto city centres and retail parks, with a tower over Leeds."
         loading="lazy">
    <button type="button" class="cs-btn cs-close">&#10005;&nbsp;Close</button>
  </div>
  <div class="cs-bar">
    <span>Yorkshire and the Humber crime hotspots &mdash; 2021&ndash;2025, hexes refining from 500&nbsp;m to 70&nbsp;m as you zoom &mdash; drag to rotate and tilt; switch crime type, toggle the Districts/Street basemap, or jump straight to Leeds, Bradford, Sheffield, York or Hull.</span>
    <button type="button" class="cs-btn cs-expand" hidden>&#10530;&nbsp;Full screen</button>
  </div>
</figure>
<script>
(function(){
  var fig=document.getElementById('yorkshire-hotspots'); if(!fig) return;
  var box=fig.querySelector('.cs-box'),
      expand=fig.querySelector('.cs-expand'),
      close=fig.querySelector('.cs-close');
  var ok=false; try{ ok=!!(window.WebGL2RenderingContext && document.createElement('canvas').getContext('webgl2')); }catch(e){}
  if(ok){
    var f=document.createElement('iframe');
    f.loading='lazy';                       // ~8.8 MB embed — defer until scrolled to
    f.src='/interactive/yorkshire-hotspots/?v=2';
    f.title='Interactive 3D hex map of Yorkshire crime hotspots';
    f.setAttribute('scrolling','no'); f.setAttribute('allow','fullscreen'); f.setAttribute('allowfullscreen','');
    box.insertBefore(f, box.firstChild);
    box.querySelector('img').style.display='none';
    expand.hidden=false; // full-screen control only makes sense with the live viz
  }
  function enter(){
    fig.classList.add('cs-big'); document.body.style.overflow='hidden';
    if(fig.requestFullscreen){ fig.requestFullscreen().catch(function(){}); }
  }
  function exit(){
    fig.classList.remove('cs-big'); document.body.style.overflow='';
    if(document.fullscreenElement){ document.exitFullscreen().catch(function(){}); }
  }
  expand.addEventListener('click',enter);
  close.addEventListener('click',exit);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&fig.classList.contains('cs-big')) exit(); });
  document.addEventListener('fullscreenchange',function(){ if(!document.fullscreenElement&&fig.classList.contains('cs-big')) exit(); });
})();
</script>
