<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>[LAB] Two-tier crime chart</title>
<style>
  @font-face {
    font-family: 'Libre Baskerville';
    src: url(/fonts/LibreBaskerville.ttf) format('truetype');
    font-weight: 400 700; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url(/fonts/DMSans.ttf) format('truetype');
    font-weight: 300 700; font-style: normal; font-display: block;
  }

  :root{
    --ink:#1a2332; --paper:#f3f6f4; --white:#fff; --deep:#243142;
    --warm-grey:#dde3df; --mid-grey:#8a9490; --chip-ink:#6b7570;
    --blue:#0070BA; --blue-light:#E2EEF7; --blue-dark:#004d80; --blue-muted:#5a9fd4;
    --amber:#E0A24E; --amber-deep:#8a5c15; --amber-light:#FBF1E2;
    --serif:'Libre Baskerville',Georgia,serif;
    --sans:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .column{max-width:800px; margin:0 auto; padding:36px 20px 90px}
  .banner{
    background:#2c2013; color:#f6e6cd; border-left:4px solid var(--amber);
    padding:13px 17px; margin-bottom:26px; font-size:13.5px; line-height:1.55;
  }
  .banner b{color:#fff}
  .banner code{font-family:ui-monospace,Menlo,monospace; font-size:12.5px}

/* ================================================================
   NeilGarratt.com — Chart component
   The publishable half of the style guide's CSS: the .ng-chart card,
   the .ngc-* SVG text scale, the legends, and the .ngl-* controls
   that charts-live.js reveals on an interactive chart.

   Deliberately declares NO :root block — the host page owns the
   palette (main.css on the site, guide.css standalone), and
   redeclaring it here would give the tokens two sources of truth.

   Every var() does carry a fallback, though. main.css was missing
   --amber, so the active chip's background resolved to `transparent`
   and its border to currentColor: an invalid var() does not fall back
   to the previous declaration, it makes the property invalid. A
   component that silently loses a colour when dropped into a page is
   worse than one that repeats a hex. Fallbacks are from palette.py.

   Ships to the site as /css/ng-chart.css.
   ================================================================ */

/* ── chart figure (the deliverable component) ── */
.ng-chart {
  background: var(--white, #fff);
  border: 1px solid var(--warm-grey, #dde3df);
  padding: 1.75rem 1.75rem 1.5rem;
  position: relative;
}
.ng-chart__eyebrow {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--blue, #0070BA);
  display: inline-flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem;
}
.ng-chart__eyebrow::before { content: ''; width: 20px; height: 2px; background: var(--blue, #0070BA); flex: none; }
/* padding-right clears the download button, which is absolutely positioned in
   the same corner; without it a long title runs underneath it. */
.ng-chart__title { font-family: var(--serif, 'Libre Baskerville', Georgia, serif); font-size: 1.2rem; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; color: var(--ink, #1a2332); padding-right: 2.6rem; }
.ng-chart__subtitle { font-size: 0.9rem; color: var(--mid-grey, #8a9490); margin-top: 0.35rem; line-height: 1.5; }
.ng-chart__plot { margin: 1.4rem 0 0.5rem; }
.ng-chart__foot {
  margin-top: 0.9rem; padding-top: 0.8rem; border-top: 1px solid var(--warm-grey, #dde3df);
  font-size: 0.72rem; color: var(--mid-grey, #8a9490); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
}
.ng-chart__source { font-style: italic; }
.ng-chart__tag { letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; font-style: normal; }

/* dark / bold tone */
.ng-chart[data-tone="bold"] {
  background: var(--deep, #243142);
  border-color: var(--deep, #243142);
}
.ng-chart[data-tone="bold"] .ng-chart__title { color: var(--paper, #f3f6f4); font-family: var(--sans, 'DM Sans', system-ui, sans-serif); font-weight: 700; font-size: 1.35rem; }
.ng-chart[data-tone="bold"] .ng-chart__eyebrow { color: var(--blue-muted, #5a9fd4); }
.ng-chart[data-tone="bold"] .ng-chart__eyebrow::before { background: var(--blue-muted, #5a9fd4); }
.ng-chart[data-tone="bold"] .ng-chart__subtitle { color: rgba(243,246,244,0.6); }
.ng-chart[data-tone="bold"] .ng-chart__foot { border-top-color: rgba(243,246,244,0.15); color: rgba(243,246,244,0.45); }
/* minimal tone: sans title */
.ng-chart[data-tone="minimal"] .ng-chart__title { font-family: var(--sans, 'DM Sans', system-ui, sans-serif); font-weight: 600; }
.ng-chart[data-tone="minimal"] .ng-chart__eyebrow::before { display: none; }
.ng-chart[data-tone="minimal"] .ng-chart__eyebrow { color: var(--mid-grey, #8a9490); }

/* ── chart svg text ── */
.ngc-svg { display: block; }
.ngc-t { font-family: var(--sans, 'DM Sans', system-ui, sans-serif); }
.ngc-axis { font-size: 13px; font-variant-numeric: tabular-nums; }
.ngc-cat  { font-size: 13.5px; font-weight: 500; }
.ngc-val  { font-size: 14px; font-variant-numeric: tabular-nums; }
.ngc-end  { font-size: 13.5px; }
.ng-chart[data-tone="bold"] .ngc-val { font-size: 16px; }
.ng-chart[data-tone="bold"] .ngc-cat { font-size: 14.5px; }
.ngc-tile-code { font-size: 13px; letter-spacing: 0.03em; }
.ngc-tile-val { font-size: 12px; font-variant-numeric: tabular-nums; }

/* legends */
.ngc-legend { display: flex; flex-wrap: wrap; gap: 1.1rem; margin-top: 0.9rem; }
/* `display:flex` beats the hidden attribute's UA `display:none`, so a hidden
   legend would still hold its margin and leave a gap above the controls. */
.ngc-legend[hidden] { display: none; }
.ngc-legend__item { font-size: 0.8rem; font-weight: 500; display: inline-flex; align-items: center; gap: 0.45rem; }
.ngc-legend__swatch { width: 12px; height: 12px; border-radius: 1px; display: inline-block; flex: none; }
.ngc-seqlegend { display: flex; align-items: center; gap: 0.6rem; margin-top: 1rem; }
.ngc-seqlegend__bar { height: 10px; flex: 1; max-width: 240px; border-radius: 1px; }
.ngc-seqlegend__lab { font-size: 0.72rem; font-variant-numeric: tabular-nums; }

/* ================================================================
   LIVE CONTROLS (.ngl-*)
   Pale-blue pills throughout. The primary row (crime type) is larger
   than the modifier rows, but every active chip reads the same, so the
   controls stay clearly chrome and never compete with the data.
   Amber is reserved for the data itself.

   The controls are hidden until charts-live.js mounts, so a reader
   with JS off never sees dead buttons under a static chart.
   ================================================================ */
/* Below the source rule, not between the plot and it. A reader screenshotting
   the chart crops to the title and the bars; keeping the controls last means
   that crop still carries the source line and the tag. */
.ngl-controls[hidden] { display: none; }
.ngl-controls {
  display: flex; flex-direction: column; gap: 0.55rem;
  margin: 1.25rem 0 0;
}

.ngl-chiprow { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.45rem 0.5rem; }
.ngl-chiprow__label {
  font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--mid-grey, #8a9490);
  flex: none; margin-right: 0.35rem; min-width: 4.6rem;
}

.ngl-chip {
  appearance: none; cursor: pointer;
  font-family: var(--sans, 'DM Sans', system-ui, sans-serif); font-size: 0.78rem; font-weight: 600; line-height: 1;
  color: var(--mid-grey, #8a9490);
  background: transparent;
  border: 1px solid var(--warm-grey, #dde3df);
  border-radius: 999px;
  padding: 0.5rem 0.9rem;
  transition: background-color 0.15s, color 0.15s, border-color 0.15s;
}
.ngl-chip:hover:not(:disabled) { color: var(--ink, #1a2332); background: var(--paper, #f3f6f4); }
/* One active treatment for every row. Amber is the data highlight colour - the
   one number that matters - so spending it on UI chrome competed with the bars
   for the reader's eye, and collided outright under the amber palette. */
.ngl-chip[aria-pressed="true"] {
  color: var(--blue-dark, #004d80); background: var(--blue-light, #E2EEF7);
  border-color: var(--blue-muted, #5a9fd4);
}
.ngl-chip:disabled { opacity: 0.35; cursor: default; }
.ngl-chip:focus-visible {
  outline: 2px solid var(--blue, #0070BA);
  outline-offset: 2px;
}

/* modifier rows — same active treatment, just quieter in size */
.ngl-chiprow--sub .ngl-chip { font-size: 0.72rem; padding: 0.38rem 0.75rem; }

/* bold tone: the card is deep navy, so invert the resting state */
.ng-chart[data-tone="bold"] .ngl-chiprow__label { color: rgba(243,246,244,0.5); }
.ng-chart[data-tone="bold"] .ngl-chip {
  color: rgba(243,246,244,0.72); border-color: rgba(243,246,244,0.22);
}
.ng-chart[data-tone="bold"] .ngl-chip:hover:not(:disabled) {
  color: var(--paper, #f3f6f4); background: rgba(243,246,244,0.10);
}
.ng-chart[data-tone="bold"] .ngl-chip[aria-pressed="true"] {
  color: var(--paper, #f3f6f4); background: rgba(24,119,184,0.35);
  border-color: var(--blue-muted, #5a9fd4);
}

/* ── tooltip ── */
.ngl-tooltip {
  position: absolute; z-index: 20; pointer-events: none;
  max-width: 17rem;
  background: var(--deep, #243142); color: var(--paper, #f3f6f4);
  border: 1px solid #3B4A5E; border-radius: 3px;
  padding: 0.5rem 0.65rem;
  font-family: var(--sans, 'DM Sans', system-ui, sans-serif); font-size: 0.76rem; line-height: 1.45;
  box-shadow: 0 4px 14px rgba(26,35,50,0.18);
  opacity: 0; transition: opacity 0.12s;
}
.ngl-tooltip[data-show="1"] { opacity: 1; }
.ngl-tooltip__key { font-weight: 700; color: var(--blue-muted, #5a9fd4); }
.ngl-tooltip__val { font-variant-numeric: tabular-nums; }
.ngl-tooltip__note { color: rgba(243,246,244,0.62); font-style: italic; margin-top: 0.25rem; }

/* bar focus ring — SVG, so outline is unreliable; use a stroke instead */
.ngl-bar:focus { outline: none; }
.ngl-bar:focus-visible rect { stroke: var(--blue, #0070BA); stroke-width: 2; }

/* ── the note line (recency / provisional caveats) ──
   Sits between the plot and the source rule, ABOVE the controls. A caveat that
   can be cropped away from the bars it qualifies is not doing its job. */
.ngl-note {
  font-size: 0.72rem; color: var(--mid-grey, #8a9490); line-height: 1.5;
  margin-top: 0.7rem; font-style: italic;
}
/* No note, no gap — the margin would otherwise open a hole above the rule. */
.ngl-note:empty { margin: 0; }
.ng-chart[data-tone="bold"] .ngl-note { color: rgba(243,246,244,0.5); }

/* ── download ──
   Top-right of the card, where a reader expects to find it. The card is already
   position:relative. It is chrome, never part of the picture: chart-export.js
   composes its own frame, so the button cannot appear in the downloaded PNG. */
.ngl-download {
  position: absolute; top: 1.4rem; right: 1.4rem; z-index: 5;
  appearance: none; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  width: 2rem; height: 2rem; padding: 0;
  color: var(--mid-grey, #8a9490);
  background: transparent;
  border: 1px solid var(--warm-grey, #dde3df);
  border-radius: 999px;
  transition: background-color 0.15s, color 0.15s, border-color 0.15s;
}
.ngl-download:hover:not(:disabled) {
  color: var(--blue-dark, #004d80); background: var(--blue-light, #E2EEF7);
  border-color: var(--blue-muted, #5a9fd4);
}
.ngl-download:focus-visible { outline: 2px solid var(--blue, #0070BA); outline-offset: 2px; }
/* Busy: the font fetch and the raster take a moment on a first click. */
.ngl-download[data-busy] { opacity: 0.5; cursor: progress; }
.ng-chart[data-tone="bold"] .ngl-download {
  color: rgba(243,246,244,0.72); border-color: rgba(243,246,244,0.22);
}
.ng-chart[data-tone="bold"] .ngl-download:hover:not(:disabled) {
  color: var(--paper, #f3f6f4); background: rgba(243,246,244,0.10);
}

/* screen-reader-only live region */
.ngl-sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

@media (prefers-reduced-motion: reduce) {
  .ngl-chip, .ngl-tooltip { transition: none; }
}

@media (max-width: 560px) {
  .ngl-chiprow__label { min-width: 100%; margin-bottom: 0.1rem; }
  .ng-chart { padding: 1.25rem 1.1rem 1.1rem; }
}


  /* ══ variant 2b menu ══════════════════════════════════════════════════
     Every row is a fixed 76px label column plus a flex:1 chip area, so a
     wrapped row aligns to a clean left edge instead of sliding under its
     own label. Blue = category tier, amber = crime tier, dashed = not in
     this total. That grammar carries the meaning and is not decorative. */
  .ngv-nav{
    display:flex; flex-direction:column; gap:8px;
    margin-top:14px; padding-top:12px; border-top:1px solid var(--warm-grey);
  }
  .ngv-row{display:flex; gap:6px; align-items:flex-start}
  .ngv-row__label{
    font:700 .6rem var(--sans); letter-spacing:.1em; text-transform:uppercase;
    color:var(--mid-grey); flex:none; width:76px; padding-top:.55rem;
  }
  .ngv-chips{display:flex; flex-wrap:wrap; gap:6px; flex:1; min-width:0}
  .ngv-stack{display:flex; flex-direction:column; gap:8px; flex:1; min-width:0}

  .ngv-chip{
    appearance:none; cursor:pointer; font-family:var(--sans); font-weight:600;
    line-height:1.2; border-radius:999px; font-size:.72rem; padding:.42rem .75rem;
    background:var(--white); border:1px solid var(--warm-grey); color:var(--chip-ink);
    transition:background-color .15s,color .15s,border-color .15s;
  }
  .ngv-chip:hover{color:var(--ink)}
  .ngv-chip:focus-visible{outline:2px solid var(--blue); outline-offset:2px}

  .ngv-chip--parent[aria-selected="true"]{
    color:var(--blue-dark); background:var(--blue-light); border-color:var(--blue-muted);
  }
  .ngv-chip--also{color:var(--amber-deep); border-color:var(--amber); border-style:dashed}
  .ngv-chip--also[aria-selected="true"]{background:var(--amber-light); border-color:var(--amber-deep)}

  /* ── the Showing row is a tween canvas, not a flex row ──
     Pills are absolutely positioned and their x / y / width are interpolated
     in pixel space over a stable keyed DOM, the same discipline charts-live.js
     uses for the bars. Height is fixed at 30px and never animates; width does.
     Rebuilding the row and then animating the container was the earlier
     mistake — it reads as a flicker because the content changes before the
     motion starts. */
  .ngv-canvas{position:relative; overflow:hidden}
  .ngv-pill{
    position:absolute; box-sizing:border-box; appearance:none; cursor:pointer;
    font-family:var(--sans); font-size:.72rem; font-weight:600;
    height:30px; line-height:28px; padding:0 12px;
    text-align:center; white-space:nowrap; overflow:hidden; border-radius:999px;
    background:var(--white); border:1px solid var(--amber); color:var(--amber-deep);
    transition:background-color .15s, color .15s;
  }
  .ngv-pill:hover{background:var(--amber-light)}
  .ngv-pill[aria-selected="true"]{background:var(--amber); color:var(--ink)}
  .ngv-pill:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
  .ngv-pill span{display:inline-block}
  /* A padding-free clipper: animating the padded box's own height floors at
     ~20px under border-box and pops. The clipper reaches a true zero. */
  .ngv-alsoclip{overflow:hidden}

  /* The More chip doubles as the dropdown trigger. Dashed while it is not
     itself a category; when a hidden category is chosen it takes that
     category's name and the selected-parent styling, so the current state
     is never invisible. */
  .ngv-more-wrap{position:relative}
  .ngv-more{display:inline-flex; align-items:center; gap:6px; border-style:dashed}
  .ngv-more[aria-selected="true"]{border-style:solid}
  .ngv-menu{
    position:absolute; left:0; top:calc(100% + 6px); width:280px; z-index:30;
    background:var(--white); border:1px solid var(--warm-grey);
    box-shadow:0 8px 24px rgba(0,0,0,.08); padding:8px;
    display:grid; grid-template-columns:1fr; gap:2px;
  }
  .ngv-menu[hidden]{display:none}
  .ngv-menu button{
    appearance:none; cursor:pointer; width:100%; text-align:left;
    font:600 .72rem var(--sans); padding:.38rem .6rem; border-radius:2px;
    background:transparent; border:0; color:var(--chip-ink);
  }
  .ngv-menu button:hover{background:var(--paper); color:var(--ink)}
  .ngv-menu button[aria-selected="true"]{background:var(--blue-light); color:var(--blue-dark)}

  /* `also` gets a box rather than a divider: a dashed chip on the same line
     as solid ones was being read as just another sub-category. */
  .ngv-also{
    box-sizing:border-box; border:1px dashed var(--amber);
    background:var(--amber-light); padding:9px 10px;
  }
  .ngv-also{display:flex; flex-direction:column; gap:9px}
  .ngv-also__group{display:flex; flex-direction:column; gap:6px}
  .ngv-also__head{
    display:block; font:700 .58rem var(--sans); letter-spacing:.09em;
    text-transform:uppercase; color:var(--amber-deep);
  }
  .ngv-also__chips{display:flex; flex-wrap:wrap; gap:6px}

  .ngv-summary{display:flex; align-items:center; gap:10px; margin-left:82px}
  .ngv-sum{
    font:italic 400 .7rem var(--sans); color:var(--mid-grey); margin:0; flex:1;
    transition:opacity .18s;
  }
  .ng-chart__title{transition:opacity .18s}
  .ngv-info{
    appearance:none; cursor:pointer; flex:none; white-space:nowrap;
    font:600 .64rem var(--sans); padding:.3rem .6rem; border-radius:999px;
    background:var(--white); border:1px solid var(--warm-grey); color:var(--mid-grey);
  }
  .ngv-info[aria-pressed="true"]{
    background:var(--blue-light); border-color:var(--blue-muted); color:var(--blue-dark);
  }
  .ngv-hint{font:italic 400 .7rem var(--sans); color:var(--blue); margin:0 0 0 82px}
  .ngv-hint[hidden]{display:none}

  .ngv-tip{
    position:fixed; z-index:60; max-width:280px; pointer-events:none;
    background:var(--deep); color:#f3f6f4; border:1px solid #3B4A5E; border-radius:3px;
    padding:9px 11px; font:400 .74rem/1.45 var(--sans);
    box-shadow:0 4px 14px rgba(26,35,50,.18);
  }
  .ngv-tip[hidden]{display:none}
  .ngv-tip b{color:var(--blue-muted); display:block; margin-bottom:2px}
  .ngv-tip i{color:rgba(243,246,244,.62); display:block; margin-top:5px}

  /* Modifier rows take the same grammar. charts-live.js puts the label and
     the buttons in one wrapping flex row, so its chips slide under the label
     when they wrap; the prototype re-wraps them to match. */
  .ngl-controls{margin-top:14px; padding-top:12px; border-top:1px solid var(--warm-grey)}
  .ngl-chiprow{gap:6px; align-items:flex-start}
  .ngl-chiprow__label{width:76px; min-width:76px; flex:none; padding-top:.45rem; margin-right:0}
  .ngv-modchips{display:flex; flex-wrap:wrap; gap:6px; flex:1; min-width:0}
  .ngl-chiprow--sub .ngl-chip{font-size:.68rem; padding:.34rem .62rem}

  .tools{
    display:flex; flex-wrap:wrap; gap:9px; align-items:center;
    margin-top:30px; padding-top:18px; border-top:1px solid var(--warm-grey);
  }
  .tools button{
    font:600 12px var(--sans); color:var(--mid-grey); background:var(--white);
    border:1px solid var(--warm-grey); border-radius:3px; padding:7px 12px; cursor:pointer;
  }
  .tools button:hover{color:var(--ink); border-color:var(--mid-grey)}
  .tools span{font-size:12px; color:var(--mid-grey)}
</style>
</head>
<body>
<div class="column">

  <div class="banner">
    <b>Lab &mdash; unlisted and noindexed.</b> A candidate two-tier category menu for the crime chart. This page carries its own copies of the chart engines, so nothing here touches the live chart at <a href="/campaigns/tracking-london-crime/">tracking-london-crime</a>. Definition copy is a first draft. Home Office vintage 2026-07-23.
  </div>

  <figure class="ng-chart" data-tone="editorial">
    <span class="ng-chart__eyebrow">Recorded crime · London</span>
    <h3 class="ng-chart__title"></h3>
    <p class="ng-chart__subtitle"></p>
    <div class="ng-chart__plot" id="ngchart-v2"></div>
    <div class="ng-chart__foot">
      <span class="ng-chart__source"></span>
      <span class="ng-chart__tag">NeilGarratt.com</span>
    </div>
  </figure>

  <div class="tools">
    <button type="button" id="pv-motion">Toggle instant transitions</button>
    <button type="button" id="pv-tour">Tour every category</button>
    <span id="pv-status"></span>
  </div>
</div>

<div class="ngv-tip" id="ngv-tip" role="tooltip" hidden></div>

<script>/* ================================================================
   NeilGarratt.com — Chart core
   Everything the static engine (charts.js) and the live engine
   (charts-live.js) must agree on, or the house style drifts:
   palettes, tones, theme resolution, scales, tick maths, number
   formatting, and the geometry constants.

   This file holds NO rendering. charts.js builds SVG strings;
   charts-live.js builds keyed DOM. They share these numbers so a
   live chart and a published PNG of the same data are the same
   picture.

   Public API:
     NGCore.state                    -> { tone, palette }   (shared default)
     NGCore.theme()                  -> resolved colours for NGCore.state
     NGCore.resolveTheme(tone, pal)  -> resolved colours, pure
     NGCore.lin(d0,d1,r0,r1)         -> linear scale fn
     NGCore.niceScale(min,max,n)     -> { min, max, step, ticks }
     NGCore.fmtCompact(v, unit, decimals) / fmtNum(v) / esc(s)
     NGCore.valueLabelPlacement(barTop, barHeight, geom)
     NGCore.readableOn(bgHex)
