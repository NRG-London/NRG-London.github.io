micide":"Murder, manslaughter, corporate manslaughter, and infanticide. Counted per victim, so one incident can record more than one.","modern_slavery":"Holding a person in slavery or servitude, or arranging their travel for exploitation. Its own offence only from 2015/16.","theft":"All theft, from shoplifting to burglary and vehicle crime. The largest offence group: about half of all recorded crime.","other_theft":"Theft that fits none of the named categories - theft in a dwelling, theft of mail, theft by an employee, making off without payment, and blackmail.","tfp":"Theft directly from a person without force: pickpocketing, bag-dipping, and snatches the victim does not resist. If force or the threat of it is used, it is robbery instead.","shoplifting":"Theft from a shop or stall.","bicycle":"Theft of a pedal cycle.","vehicle":"Vehicles as targets of theft: theft of them, theft from them, and interfering with them. Not driving offences, and not damage - the Home Office counts those elsewhere, and they are shown here only as related views.","veh_from":"Theft of property from inside or attached to a vehicle - the largest single vehicle offence.","veh_of":"Theft or unauthorised taking of a motor vehicle, including aggravated vehicle taking.","veh_interfere":"Tampering with a vehicle or its parts with intent to steal - caught before a theft was completed.","burglary":"Entering a building as a trespasser to steal, or to commit certain other offences. Split by whether the building is somebody's home.","burg_homes":"Burglary of a dwelling. Called domestic burglary before 2017 and residential burglary after; the same offences, summed across the rename.","burg_other":"Burglary of a building that is not a home - shops, offices, sheds, and garages.","robbery":"Theft using force or the threat of force. A phone taken after a struggle is robbery; a pocket picked unnoticed is theft from the person.","rob_personal":"Robbery of an individual's own property, in the street or anywhere else.","rob_business":"Robbery of property belonging to a business - a till, a delivery, a shop's takings.","sexual":"All sexual offences, from exposure and voyeurism through to rape.","rape":"Rape and attempted rape, of adults and of children.","other_sexual":"Sexual assault, sexual activity with a child, exposure, voyeurism, and related offences.","damage":"Destroying or damaging property, including by fire.","dam_criminal":"Damaging or destroying property without fire.","dam_arson":"Damaging or destroying property by fire, whether or not life was endangered.","dam_vehicle":"Damaging a vehicle without taking it - keyed panels, smashed windows, and slashed tyres.","threat_damage":"Threatening to damage property, or having something with you intending to.","drugs":"Possession, supply, and production of controlled drugs.","drug_poss":"Possession of a controlled drug for personal use.","drug_traf":"Supplying or producing controlled drugs, or possessing them with intent to supply.","order":"Offences that disturb public order, from causing alarm or distress up to violent disorder.","order_fad":"Causing fear, alarm or distress. The Home Office does not separate the Public Order Act sections here, so affray, threatening behaviour, and section 5 harassment, alarm, or distress all sit inside this one figure.","order_racial":"Causing fear, alarm, or distress where racial or religious hostility was demonstrated or provided the motive. The main route by which hate speech, online and off, reaches the figures. Assaults, harassment, and criminal damage have their own racially aggravated offences, counted in those categories rather than here.","order_disorder":"Violent disorder: twelve or more people using or threatening unlawful violence. Riot is a separate offence but records no counts in this series.","order_other":"A single Home Office code - other offences against the State or public order - covering whatever the other three do not. It cannot be broken down any further here. Riot and treason have codes of their own but record no offences in this series.","weapons":"Carrying a weapon, not using one - an offence in itself, whatever else did or did not happen.","wep_blade":"Having an article with a blade or point in a public place or a school.","wep_firearms":"Possession of a firearm, with or without intent to use it.","wep_other":"Possession of an offensive weapon that is neither a firearm nor a blade.","misc":"The Home Office's catch-all: 36 offence codes that fit nowhere else, from obscene publications to perjury.","obscene":"Publishing, distributing, or possessing obscene material.","perverting":"Perverting the course of justice.","handling":"Receiving, keeping, or selling goods known or believed to be stolen.","dangerous_driving":"Dangerous driving that did not cause death or serious injury.","going_equipped":"Being caught with tools intended for a theft or burglary that had not yet happened.","soliciting":"Soliciting or loitering for the purposes of prostitution.","exploitation":"Causing, inciting, or controlling prostitution for gain.","other_misc":"The rest of the miscellaneous group - perjury, bail offences, forgery, wildlife offences, and numerous other hard-to-categorise offences.","knife":"Selected serious offences where a knife or sharp instrument was used or threatened. It incorporates offences from the other categories rather than sitting beside them: every offence here is also counted in its own crime type, so knife robbery is part of robbery and homicide with a knife is part of homicide. A separate Home Office collection, which is why it reaches back to 2008/09 when the rest starts in 2012/13.","knife_robbery":"Robbery where a knife was used or threatened. About a quarter of all London robbery.","knife_assault":"Assault causing injury, or with intent to cause serious harm, where a knife was used or threatened.","knife_threats":"Threats to kill involving a knife.","knife_rape":"Rape where a knife was used or threatened.","knife_attmurder":"Attempted murder involving a knife.","knife_sexassault":"Sexual assault where a knife was used or threatened.","knife_homicide":"Homicide where a knife or sharp instrument was used - close to half of all London homicide."},"alsoNotes":{"violence|modern_slavery":{"kind":"inside","note":"Part of Violence without injury, so already counted in the Violence against the person total."},"violence|knife_assault":{"kind":"inside","note":"Part of Violence with injury, so already counted in the Violence against the person total."},"violence|knife_homicide":{"kind":"inside","note":"Part of Homicide, so already counted in the Violence against the person total."},"theft|handling":{"kind":"outside","note":"Not counted under Theft, this offence is counted under Miscellaneous crimes."},"theft|going_equipped":{"kind":"outside","note":"Not counted under Theft, this offence is counted under Miscellaneous crimes."},"vehicle|bicycle":{"kind":"outside","note":"Not counted under Vehicle offences, this offence is counted under Theft."},"vehicle|dam_vehicle":{"kind":"outside","note":"Not counted under Vehicle offences, this offence is counted under Criminal damage and arson."},"vehicle|dangerous_driving":{"kind":"outside","note":"Not counted under Vehicle offences, this offence is counted under Miscellaneous crimes."},"vehicle|driving_death":{"kind":"outside","note":"Not counted under Vehicle offences, this offence is counted under Violence against the person."},"robbery|knife_robbery":{"kind":"inside","note":"Already counted in the Robbery total."},"sexual|knife_rape":{"kind":"inside","note":"Part of Rape, so already counted in the Sexual offences total."},"sexual|knife_sexassault":{"kind":"inside","note":"Part of Other sexual offences, so already counted in the Sexual offences total."},"sexual|soliciting":{"kind":"outside","note":"Not counted under Sexual offences, this offence is counted under Miscellaneous crimes."},"sexual|exploitation":{"kind":"outside","note":"Not <script>
(function () {
  'use strict';
  var spec = JSON.parse(document.getElementById('ngchart-v2-data').textContent);
  var figure = document.querySelector('.ng-chart');
  var chart = NGLive.mount('ngchart-v2', spec);
  var tipEl = document.getElementById('ngv-tip');

  /* Order for this sprint: chart, source and attribution, caveats, controls.
     charts-live.js currently puts the note ABOVE the foot, so the prototype
     swaps them here rather than editing the shared engine. */
  var foot = figure.querySelector('.ng-chart__foot');
  var note = figure.querySelector('.ngl-note');
  if (foot && note) figure.insertBefore(foot, note);

  /* The engine's own rows wrap their chips under the label. Re-wrap them so
     every row in the card shares the 76px-label grammar. */
  [].forEach.call(figure.querySelectorAll('.ngl-chiprow'), function (row) {
    var box = document.createElement('div');
    box.className = 'ngv-modchips';
    while (row.children.length > 1) box.appendChild(row.children[1]);
    row.appendChild(box);
  });

  var byKey = {};
  spec.tiers.forEach(function (t) { byKey[t.key] = t; });
  var pinned = spec.pinned;
  var hidden = spec.tiers.filter(function (t) { return pinned.indexOf(t.key) === -1; });

  var GAP = 6, PILL_H = 30;
  var REDUCED = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DUR = REDUCED ? 0 : 750;
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function copyV(v) { return { x: v.x, y: v.y, w: v.w, op: v.op }; }
  var ease = NGLive.easeCubicInOut;

  var state = { parent: null, crime: spec.initial.crime,
                moreOpen: false, definitions: false, tipKey: null };
  var pills = [], anim = null, lastW = 0, alsoTarget = null;

  /* ---------- scaffold ---------- */
  var nav = el('div', 'ngv-nav');
  var catRow = row('Category');
  var showRow = row('Showing');
  var showStack = el('div', 'ngv-stack');
  var canvas = el('div', 'ngv-canvas');
  var alsoClip = el('div', 'ngv-alsoclip');
  var alsoBox = el('div', 'ngv-also');
  alsoClip.appendChild(alsoBox);
  showStack.appendChild(canvas);
  showStack.appendChild(alsoClip);
  showRow.el.removeChild(showRow.chips);
  showRow.el.appendChild(showStack);

  var moreWrap = el('div', 'ngv-more-wrap');
  var moreBtn = el('button', 'ngv-chip ngv-chip--parent ngv-more');
  moreBtn.type = 'button';
  moreBtn.setAttribute('aria-haspopup', 'true');
  var moreMenu = el('div', 'ngv-menu');
  moreMenu.hidden = true;
  moreWrap.appendChild(moreBtn);
  moreWrap.appendChild(moreMenu);

  var summary = el('div', 'ngv-summary');
  var sumLine = el('p', 'ngv-sum');
  var infoBtn = el('button', 'ngv-info');
  infoBtn.type = 'button';
  infoBtn.innerHTML = '&#9432; definitions';
  infoBtn.setAttribute('aria-pressed', 'false');
  summary.appendChild(sumLine);
  summary.appendChild(infoBtn);
  var hint = el('p', 'ngv-hint');
  hint.textContent = 'Definitions on — tap any chip to read what it counts; '
                   + 'tap the button again to go back to selecting.';
  hint.hidden = true;

  nav.appendChild(catRow.el);
  nav.appendChild(showRow.el);
  nav.appendChild(summary);
  nav.appendChild(hint);
  figure.insertBefore(nav, figure.querySelector('.ngl-controls'));

  function el(tag, cls) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    return n;
  }
  function row(label) {
    var r = el('div', 'ngv-row');
    var lab = el('span', 'ngv-row__label');
    lab.textContent = label;
    r.appendChild(lab);
    var chips = el('div', 'ngv-chips');
    r.appendChild(chips);
    return { el: r, chips: chips };
  }
  function labelFor(k) { return (spec.copy[k] && spec.copy[k].label) || k; }
  function shortFor(k) { return spec.short[k] || labelFor(k); }

  /* ---------- tooltips ----------
     Keys are read from the element at hover time, never closed over: a pill is
     RECYCLED across category changes, so the chip under the cursor is not the
     one the handler was created for. */
  var hoverTimer = null, HOVER_DELAY = 450;

  function tipContent(key, kind) {
    var tier = byKey[state.parent];
    var title, body, note = '';
    if (kind === 'child' && key === tier.key) {
      title = 'Total — ' + tier.label;
      body = 'The whole "' + tier.label + '" category: the sum of the '
           + tier.split.length + ' crime types shown.';
    } else {
      title = labelFor(key);
      body = spec.definitions[key] || '';
    }
    if (kind === 'also') {
      var a = spec.alsoNotes[tier.key + '|' + key];
      if (a) note = a.note;
    }
    return { title: title, body: body, note: note };
  }

  function showTip(btn, key, kind) {
    var t = tipContent(key, kind);
    tipEl.innerHTML = '';
    var b = document.createElement('b');
    b.textContent = t.title;
    tipEl.appendChild(b);
    tipEl.appendChild(document.createTextNode(t.body));
    if (t.note) {
      var i = document.createElement('i');
      i.textContent = t.note;
      tipEl.appendChild(i);
    }
    tipEl.hidden = false;
    var r = btn.getBoundingClientRect();
    tipEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 296)) + 'px';
    tipEl.style.top = (r.bottom + 8) + 'px';
    state.tipKey = key;
  }
  function hideTip() { tipEl.hidden = true; state.tipKey = null; }

  function wireTip(btn, kind, keyOf) {
    btn.addEventListener('mouseenter', function () {
      if (state.definitions) return;
      clearTimeout(hoverTimer);
      hoverTimer = setTimeout(function () { showTip(btn, keyOf(), kind); }, HOVER_DELAY);
    });
    btn.addEventListener('mouseleave', function () {
      clearTimeout(hoverTimer);
      if (!state.definitions) hideTip();
    });
  }

  /* ---------- category row (unchanged: a plain wrapping flex row) ---------- */
  function chip(key, label, kind, selected) {
    var b = el('button', 'ngv-chip ngv-chip--' + kind);
    b.type = 'button';
    b.textContent = label;
    b.dataset.key = key;
    b.setAttribute('aria-selected', String(!!selected));
    wireTip(b, kind, function () { return b.dataset.key; });
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      if (state.definitions) {
        if (state.tipKey === b.dataset.key) hideTip();
        else showTip(b, b.dataset.key, kind);
        return;
      }
      hideTip();
      if (kind === 'parent') selectParent(b.dataset.key);
      else selectCrime(b.dataset.key);
    });
    return b;
  }

  function buildCategoryRow() {
    catRow.chips.textContent = '';
    pinned.forEach(function (k) {
      catRow.chips.appendChild(chip(k, shortFor(k), 'parent', state.parent === k));
    });
    catRow.chips.appendChild(moreWrap);

    var inMore = hidden.some(function (t) { return t.key === state.parent; });
    moreBtn.textContent = (inMore ? shortFor(state.parent) : 'More') + ' ▾';
    moreBtn.setAttribute('aria-selected', String(inMore));

    moreMenu.textContent = '';
    hidden.forEach(function (t) {
      var b = el('button');
      b.type = 'button';
      // Short form here too: the dropdown is the same row of buttons by
      // another name, and a reader should not meet two names for one thing.
      b.textContent = shortFor(t.key);
      b.dataset.key = t.key;
      b.setAttribute('aria-selected', String(state.parent === t.key));
      wireTip(b, 'parent', function () { return t.key; });
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        if (state.definitions) { showTip(b, t.key, 'parent'); return; }
        selectParent(t.key);
        setMore(false);
      });
      moreMenu.appendChild(b);
    });
  }

  function setMore(open) {
    state.moreOpen = open;
    moreMenu.hidden = !open;
    moreBtn.setAttribute('aria-expanded', String(open));
  }
  moreBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    hideTip();
    setMore(!state.moreOpen);
  });
  document.addEventListener('click', function () {
    if (state.moreOpen) setMore(false);
    if (state.definitions && !tipEl.hidden) hideTip();
  });

  /* ================================================================
     THE SHOWING ROW — "soap bubbles"
     Pills are recycled by POSITION: pill i stays pill i, squeezes to its new
     width, and crossfades its label at the halfway point. Surplus pills
     inflate in or deflate away. One master clock, everything driven off one
     eased t, interpolated in pixel space — the same discipline as the bars.
     ================================================================ */
  function paint(r) {
    var st = r.el.style, w = Math.max(0, r.cur.w);
    st.left = r.cur.x + 'px';
    st.top = r.cur.y + 'px';
    st.width = w + 'px';
    // Under border-box a pill cannot shrink below its own padding, which pops
    // at about 24px. Animating the padding with the width removes the floor.
    var pad = Math.min(12, Math.max(0, w / 2 - 2));
    st.paddingLeft = pad + 'px';
    st.paddingRight = pad + 'px';
    st.opacity = r.cur.op;
  }

  var measurer = null;
  function measure(label) {
    if (!measurer) {
      measurer = el('button', 'ngv-pill ngv-measure');
      measurer.setAttribute('aria-hidden', 'true');
      measurer.tabIndex = -1;
      measurer.style.cssText = 'visibility:hidden;left:-9999px;top:0';
      canvas.appendChild(measurer);
    }
    measurer.textContent = label;
    return measurer.offsetWidth;
  }

  // Simulate flex-wrap, because the pills are absolutely positioned and the
  // browser will not do it for us.
  function layout(list, W) {
    var x = 0, y = 0, pos = [];
    list.forEach(function (it) {
      if (x > 0 && x + it.w > W) { x = 0; y += PILL_H + GAP; }
      pos.push({ x: x, y: y });
      x += it.w + GAP;
    });
    return { pos: pos, height: y + PILL_H };
  }

  // 'TOTAL' is a stable key so the Total pill recycles across categories
  // instead of exiting and re-entering on every change.
  function childList() {
    var t = byKey[state.parent];
    var useShort = t.key === 'total';
    var out = [{ key: 'TOTAL', crime: t.key, label: 'Total' }];
    t.split.forEach(function (k) {
      out.push({ key: k, crime: k, label: useShort ? shortFor(k) : labelFor(k) });
    });
    return out;
  }

  function makePill(it) {
    var b = el('button', 'ngv-pill');
    b.type = 'button';
    var sp = document.createElement('span');
    sp.textContent = it.label;
    b.appendChild(sp);
    b.dataset.key = it.crime;
    b.setAttribute('aria-selected', String(it.crime === state.crime));
    wireTip(b, 'child', function () { return b.dataset.key; });
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      if (state.definitions) {
        if (state.tipKey === b.dataset.key) hideTip();
        else showTip(b, b.dataset.key, 'child');
        return;
      }
      hideTip();
      selectCrime(b.dataset.key);
    });
    canvas.appendChild(b);
    return b;
  }

  /* Two kinds live in this box and one heading cannot describe both.
     Sexual offences proves it: rape at knifepoint IS inside the sexual
     offences total, while soliciting is counted under miscellaneous crimes.
     "Related, not in this total" was true of the second and flatly false of
     the first. Each kind now gets its own heading, and a heading only appears
     when it has chips — so the six single-kind boxes look much as before. */
  var ALSO_HEADS = {
    inside: 'Also inside this total',
    outside: 'Related, counted elsewhere'
  };

  function buildAlso(list) {
    alsoBox.textContent = '';
    var parent = state.parent;
    ['inside', 'outside'].forEach(function (kind) {
      var keys = list.filter(function (k) {
        var a = spec.alsoNotes[parent + '|' + k];
        return a && a.kind === kind;
      });
      if (!keys.length) return;
      var group = el('div', 'ngv-also__group');
      var head = el('span', 'ngv-also__head');
      head.textContent = ALSO_HEADS[kind];
      var chips = el('div', 'ngv-also__chips');
      keys.forEach(function (k) {
        chips.appendChild(chip(k, labelFor(k), 'also', k === state.crime));
      });
      group.appendChild(head);
      group.appendChild(chips);
      alsoBox.appendChild(group);
    });
  }

  function syncSelection() {
    [].forEach.call(canvas.querySelectorAll('.ngv-pill:not(.ngv-measure)'), function (b) {
      b.setAttribute('aria-selected', String(b.dataset.key === state.crime));
    });
    [].forEach.call(alsoBox.querySelectorAll('.ngv-chip'), function (b) {
      b.setAttribute('aria-selected', String(b.dataset.key === state.crime));
    });
  }

  /* Static layout: first paint, font load, resize. */
  function instantLayout() {
    if (anim) return;
    var W = canvas.clientWidth;
    if (!W || (W === lastW && pills.length)) return;
    lastW = W;
    var list = childList();
    list.forEach(function (it) { it.w = measure(it.label); });
    var lay = layout(list, W);
    pills.forEach(function (p) { p.el.remove(); });
    pills = list.map(function (it, i) {
      var node = makePill(it);
      var rec = { el: node, span: node.firstChild, key: it.key,
                  cur: { x: lay.pos[i].x, y: lay.pos[i].y, w: it.w, op: 1 } };
      paint(rec);
      return rec;
    });
    canvas.style.height = lay.height + 'px';
    var also = byKey[state.parent].also;
    buildAlso(also);
    if (also.length) {
      alsoClip.style.display = 'block';
      alsoClip.style.height = 'auto';
      alsoClip.style.marginTop = '8px';
      alsoClip.style.opacity = '1';
      alsoClip.style.height = alsoClip.offsetHeight + 'px';
    } else {
      alsoClip.style.display = 'none';
      alsoClip.style.height = '0';
      alsoClip.style.marginTop = '0';
    }
    syncSelection();
  }

  function alsoTween() {
    var list = byKey[state.parent].also;
    var h0 = alsoClip.style.display === 'none' ? 0 : alsoClip.offsetHeight;
    var m0 = h0 > 0 ? 8 : 0;
    buildAlso(list);
    var h1 = 0, m1 = list.length ? 8 : 0;
    if (list.length) {
      alsoClip.style.display = 'block';
      alsoClip.style.height = 'auto';
      h1 = alsoClip.offsetHeight;
    } else if (h0 === 0) {
      alsoClip.style.display = 'none';
      return null;
    }
    alsoClip.style.height = h0 + 'px';
    alsoClip.style.marginTop = m0 + 'px';
    alsoTarget = { h: h1, show: list.length > 0 };
    return function (e) {
      alsoClip.style.height = (h0 + (h1 - h0) * e) + 'px';
      alsoClip.style.marginTop = (m0 + (m1 - m0) * e) + 'px';
      alsoClip.style.opacity = h1 === 0 ? String(1 - e) : h0 === 0 ? String(e) : '1';
    };
  }

  function tween() {
    var W = canvas.clientWidth;
    if (!W) { instantLayout(); return; }
    var list = childList();
    list.forEach(function (it) { it.w = measure(it.label); });
    var lay = layout(list, W);
    var startH = canvas.offsetHeight;

    // The old set is whatever is truly on screen. A click mid-flight retargets
    // from the current interpolated values rather than restarting, so nothing
    // ever snaps.
    var old = anim
      ? anim.recs.map(function (r) {
          return { el: r.el, span: r.span, exit: r.mode === 'exit', cur: copyV(r.cur) };
        })
      : pills.map(function (p) {
          return { el: p.el, span: p.span, exit: false, cur: copyV(p.cur) };
        });
    if (anim) { cancelAnimationFrame(anim.raf); anim = null; }

    var recs = [];
    var live = old.filter(function (p) { return !p.exit; })
      .sort(function (a, b) { return a.cur.y - b.cur.y || a.cur.x - b.cur.x; });

    list.forEach(function (it, i) {
      var to = { x: lay.pos[i].x, y: lay.pos[i].y, w: it.w, op: 1 };
      if (i < live.length) {
        var p = live[i];
        recs.push({ el: p.el, span: p.span, newCrime: it.crime, newLabel: it.label,
                    from: copyV(p.cur), to: to, mode: 'morph', swapped: false,
                    cur: copyV(p.cur) });
      } else {
        var node = makePill(it);
        var rec = { el: node, span: node.firstChild,
                    from: { x: to.x, y: to.y, w: 0, op: 0 }, to: to,
                    mode: 'enter', cur: { x: to.x, y: to.y, w: 0, op: 0 } };
        paint(rec);
        recs.push(rec);
      }
    });
    live.slice(list.length).forEach(function (p) {
      recs.push({ el: p.el, span: p.span, from: copyV(p.cur),
                  to: { x: p.cur.x, y: p.cur.y, w: 0, op: 0 },
                  mode: 'exit', cur: copyV(p.cur) });
    });
    old.filter(function (p) { return p.exit; }).forEach(function (p) {
      recs.push({ el: p.el, span: p.span, from: copyV(p.cur),
                  to: { x: p.cur.x, y: p.cur.y, w: 0, op: 0 },
                  mode: 'exit', cur: copyV(p.cur) });
    });

    // Leavers under survivors under arrivals, so overlap never looks wrong.
    recs.forEach(function (r) {
      r.el.style.zIndex = r.mode === 'exit' ? '1' : r.mode === 'enter' ? '3' : '2';
      if (r.mode === 'exit') r.el.style.pointerEvents = 'none';
    });

    var stepAlso = alsoTween();
    var t0 = null;

    function frame(ts) {
      if (t0 === null) t0 = ts;
      var t = DUR <= 0 ? 1 : Math.min((ts - t0) / DUR, 1);
      var e = ease(t);
      recs.forEach(function (r) {
        r.cur.x = r.from.x + (r.to.x - r.from.x) * e;
        r.cur.y = r.from.y + (r.to.y - r.from.y) * e;
        r.cur.w = r.from.w + (r.to.w - r.from.w) * e;
        if (r.mode === 'exit') r.cur.op = r.from.op * (1 - e);
        else if (r.mode === 'enter') r.cur.op = e;
        else r.cur.op = 1;
        if (r.mode === 'morph') {
          r.span.style.opacity = e < 0.5 ? String(1 - e * 2) : String((e - 0.5) * 2);
          if (e >= 0.5 && !r.swapped) {
            r.swapped = true;
            r.span.textContent = r.newLabel;
            r.el.dataset.key = r.newCrime;
            r.el.setAttribute('aria-selected', String(r.newCrime === state.crime));
          }
        }
        paint(r);
      });
      canvas.style.height = (startH + (lay.height - startH) * e) + 'px';
      if (stepAlso) stepAlso(e);
      if (t < 1) { anim.raf = requestAnimationFrame(frame); return; }
      finish(recs, lay);
    }
    anim = { recs: recs, raf: requestAnimationFrame(frame) };
  }

  function finish(recs, lay) {
    pills = [];
    recs.forEach(function (r) {
      if (r.mode === 'exit') { r.el.remove(); return; }
      r.cur = copyV(r.to);
      paint(r);
      r.span.style.opacity = '1';
      r.el.style.zIndex = '2';
      pills.push({ el: r.el, span: r.span, cur: r.cur });
    });
    canvas.style.height = lay.height + 'px';
    if (alsoTarget) {
      if (!alsoTarget.show) {
        alsoClip.style.display = 'none';
        alsoClip.style.height = '0';
        alsoClip.style.marginTop = '0';
      } else {
        alsoClip.style.height = alsoTarget.h + 'px';
        alsoClip.style.opacity = '1';
      }
      alsoTarget = null;
    }
    anim = null;
    syncSelection();
  }

  /* ---------- copy, crossfaded rather than cut ---------- */
  function fadeSwap(node, text) {
    if (node.textContent === text) return;
    if (DUR <= 0) { node.textContent = text; return; }
    clearTimeout(node._swap);
    node.style.opacity = '0';
    node._swap = setTimeout(function () {
      node.textContent = text;
      node.style.opacity = '1';
    }, 180);
  }

  function summaryText() {
    var t = byKey[state.parent];
    if (t.also.indexOf(state.crime) !== -1) {
      var a = spec.alsoNotes[t.key + '|' + state.crime];
      return a ? a.note : '';
    }
    if (t.key === 'knife') {
      return 'Knife crime incorporates offences from the other categories — '
           + 'each of these is also counted in its own crime type.';
    }
    return shortFor(t.key) + ' is the sum of the ' + t.split.length
         + ' crime types shown.';
  }

  function selectParent(key) {
    if (key === state.parent) { setMore(false); return; }
    state.parent = key;
    state.crime = key;                 // land on the category's own total
    setMore(false);
    buildCategoryRow();
    tween();
    window.__setView({ crime: key });
    fadeSwap(sumLine, summaryText());
  }

  function selectCrime(key) {
    if (key === state.crime) return;
    state.crime = key;
    window.__setView({ crime: key });
    syncSelection();
    fadeSwap(sumLine, summaryText());
  }

  // Resize and font load re-lay-out instantly, and only when idle.
  window.addEventListener('resize', instantLayout);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { lastW = 0; instantLayout(); });
  }

  infoBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    state.definitions = !state.definitions;
    infoBtn.setAttribute('aria-pressed', String(state.definitions));
    hint.hidden = !state.definitions;
    hideTip();
  });

  // Roving arrow keys within each row, matching the engine's chip rows.
  [catRow.chips, showStack].forEach(function (scope) {
    scope.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      // Pills are absolutely positioned and recycled, so DOM order is creation
      // order rather than reading order. Sort by where they actually are.
      var btns = [].slice.call(
        scope.querySelectorAll('.ngv-pill:not(.ngv-measure),.ngv-chip'))
        .sort(function (a, b) {
          var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
          return (ra.top - rb.top) || (ra.left - rb.left);
        });
      var i = btns.indexOf(document.activeElement);
      if (i === -1) return;
      e.preventDefault();
      btns[(i + (e.key === 'ArrowRight' ? 1 : btns.length - 1)) % btns.length].focus();
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { hideTip(); setMore(false); }
  });

  // Open on whichever row carries the initial view.
  var startParent = spec.initial.crime;
  if (!byKey[startParent]) {
    spec.tiers.forEach(function (t) {
      if (t.split.indexOf(spec.initial.crime) !== -1 && !byKey[startParent]) {
        startParent = t.key;
      }
    });
  }
  state.parent = byKey[startParent] ? startParent : spec.tiers[0].key;
  state.crime = spec.initial.crime;
  buildCategoryRow();
  instantLayout();            // first paint has nothing to animate from
  sumLine.textContent = summaryText();
  window.__setView({ crime: state.crime });

  /* ---------- prototype tools ---------- */
  var instant = false;
  document.getElementById('pv-motion').addEventListener('click', function (e) {
    e.stopPropagation();
    instant = !instant;
    chart.setTransition(instant ? 1 : 750);
    status(instant ? 'transitions instant' : 'transitions 750ms');
  });
  document.getElementById('pv-tour').addEventListener('click', function (e) {
    e.stopPropagation();
    var seq = [];
    spec.tiers.forEach(function (t) {
      seq.push([t.key, t.key]);
      t.split.forEach(function (k) { seq.push([t.key, k]); });
      t.also.forEach(function (k) { seq.push([t.key, k]); });
    });
    var i = 0;
    (function next() {
      if (i >= seq.length) { status('tour finished — ' + seq.length + ' views'); return; }
      if (state.parent !== seq[i][0]) selectParent(seq[i][0]);
      selectCrime(seq[i][1]);
      status('tour ' + (i + 1) + '/' + seq.length + ' — ' + labelFor(seq[i][1]));
      i++;
      setTimeout(next, instant ? 110 : 850);
    })();
  });
  function status(t) { document.getElementById('pv-status').textContent = t; }
  status(Object.keys(spec.datasets).length + ' datasets · '
         + spec.tiers.length + ' categories · ' + pinned.length + ' pinned');
})();
</script>
</body>
</html>
