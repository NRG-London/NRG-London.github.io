<style>
  /* DM Sans only. The borough label layer asks for it by name, and an SDF atlas
     built before the face has arrived bakes the fallback in for the life of the
     page — so the boot waits on it (see FONTS) rather than hoping. Libre
     Baskerville went with the card that used it. */
  @font-face {
    font-family: 'DM Sans';
    src: url(/fonts/DMSans.ttf) format('truetype');
    font-weight: 300 700; font-style: normal; font-display: block;
  }

  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { background: #1A2332; font-family: 'DM Sans', sans-serif; }
  #map { position: absolute; inset: 0; }
  #map canvas { outline: none; }

  /* The lab panel is deliberately plain — no site CSS, no web font, nothing
     that has to load before it is readable. It also has to FIT INSIDE the
     420x260 box the capture driver crops away before comparing two
     screenshots: anything of it that spills outside that box is a difference
     between two otherwise identical frames. */
  #panel {
    position: fixed; top: 0; left: 0; z-index: 30;
    width: 404px; box-sizing: border-box; padding: 6px 8px 7px;
    background: rgba(12, 17, 24, 0.92); color: #D7DAE0;
    font: 11px/1.35 system-ui, sans-serif;
  }
  #panel h1 {
    font: 700 10px/1.2 system-ui, sans-serif; letter-spacing: 0.1em;
    text-transform: uppercase; color: #7E8B9B; margin: 0 0 5px;
  }
  #panel .row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; align-items: center; }
  #panel button, #panel select, #panel input {
    font: 11px system-ui, sans-serif; color: #E8EDF2;
    background: #24313F; border: 1px solid #3B4A5E; border-radius: 4px;
    padding: 3px 6px; cursor: pointer;
  }
  #panel input { width: 46px; cursor: text; }
  #panel input[type=range] { width: 92px; padding: 0; cursor: pointer; vertical-align: middle; }
  #panel button:disabled { opacity: 0.4; cursor: default; }
  #panel button:hover:enabled { background: #34455C; }
  #panel .lbl { color: #7E8B9B; }
  #hud {
    margin-top: 5px; padding-top: 5px; border-top: 1px solid #2A3542;
    color: #9FB0C2; font: 10.5px/1.45 ui-monospace, Consolas, monospace;
    white-space: pre-wrap; word-break: break-all;
  }
</style>
</head>

  <div id="map"></div>

  <div id="panel">
    <h1>morph lab v2 &mdash; boundary warp, pop density 2021</h1>
    <div class="row">
      <button id="bSplit" disabled>borough &rarr; ward (split)</button>
      <button id="bMerge" disabled>ward &rarr; borough (merge)</button>
      <button id="bSpike" disabled>spike: warp only</button>
    </div>
    <div class="row">
      <span class="lbl">inset s</span>
      <input id="inset" type="range" min="0.85" max="0.98" step="0.005" value="0.92">
      <span class="lbl" id="insetOut">0.920</span>
      <span class="lbl">values ms</span><input id="durVal" type="number" min="1" step="50" value="750">
    </div>
    <div class="row">
      <span class="lbl">open ms</span><input id="durOpen" type="number" min="1" step="50" value="400">
      <span class="lbl">heal ms</span><input id="durHeal" type="number" min="1" step="50" value="350">
      <span class="lbl">merge inset</span><input id="insetM" type="number" min="0.5" max="1" step="0.01" value="0.94">
    </div>
    <div id="hud">booting&hellip;</div>
  </div>

  var TIERS = {};        // key -> promise of {header, ringStart, featureOf, pos, ...}
  var GROUPS = {};       // "tier:group" -> promise of {slots}

  // GEOMETRY IS SHARED BY EVERY YEAR. Only the values and the denominators are
  // per year, and this harness only ever asks for one of them.
  function loadTier(t) {
    if (TIERS[t]) return TIERS[t];
    var spec = MANIFEST.tiers[t];
    TIERS[t] = Promise.all([
      fetchContainer(DATA_BASE + spec.geom + CACHEBUST, "NGG1"),
      loadBase(t, YEAR),
      fetchJson(DATA_BASE + spec.labels + CACHEBUST)
    ]).then(function (parts) {
      var g = parts[0], h = g.header, o = h.byteOffsets;
      var ringStart = new Uint32Array(g.buf, g.base + o[0], h.nRings + 1);
      var featureOf = new Uint32Array(g.buf, g.base + o[1], h.nRings);
      var q = new Uint16Array(g.buf, g.base + o[2], h.nVerts * 2);

      // Float64, not Float32: deck.gl uses 64-bit positions for LNGLAT, and a
      // float32 ulp at this latitude is ~0.7 m — visible jitter past z17.
      var pos = new Float64Array(h.nVerts * 2);
      var x0 = h.bbox[0], y0 = h.bbox[1], sx = h.scale[0], sy = h.scale[1];
      for (var i = 0, n = h.nVerts; i < n; i++) {

        pos[2 * i + 1] = y0 + q[2 * i + 1] * sy;
      }
      // posTrue is the geography as it really is, kept aside and never written
      // to: every warped buffer is derived from it, so a warp of a warp cannot
      // happen and the tier can always be asked for its true outline again.
      // Under ?pos=f32 the WARP tier's canonical buffer is Float32 from the
      // first draw onwards — not downcast half way through — because deck.gl
      // decides whether an attribute is double-precision by looking at the
      // array it is handed, and changing that answer mid-session would change
      // the shape of the buffer it is interpolating from.
      var posTrue = (POS_F32 && t === WARP) ? new Float32Array(pos) : pos;
      return {
        key: t, header: h, ringStart: ringStart, featureOf: featureOf,
        pos: posTrue, posTrue: posTrue, posS: 1, posPhase: 0,
        base: parts[1], bases: {}, labels: parts[2],
        col: new Uint8ClampedArray(h.nVerts * 4),
        elev: new Float32Array(h.nVerts),

  }

  // and bases grow with the area — an output area holds ~330 residents and a
  // borough a third of a million — so the aggregated area types widen to
  // uint32 while the census ones stay uint16.
  var SLOT_CTOR = { f32: Float32Array, u32: Uint32Array, u16: Uint16Array };
  var SLOT_NODATA = { f32: null, u32: 4294967295, u16: 65535 };

  function readSlots(c) {

    c.header.slots.forEach(function (s, i) {

      out[s.key] = new Ctor(c.buf, c.base + o[i], n);
      out.__nodata[s.key] = SLOT_NODATA[s.type];
    });
    return out;
  }

  //

  // small file, so the group a caller asked for is ignored and all of them
  // resolve to the same promise. THIS is why the harness must not hand-roll
  // filenames: four of the six area types bundle their measures differently
  // from the two census ones.
  function loadGroup(t, g, year) {
    var single = MANIFEST.tiers[t].single;
    var file = single || GROUP_BY_KEY[g].file;
    var k = groupCacheKey(t, g, year);
    if (!GROUPS[k]) {
      GROUPS[k] = fetchContainer(
        DATA_BASE + MANIFEST.tiers[t].prefix + year + "." + file + ".bin" +
        CACHEBUST, "NGV1").then(readSlots).then(function (s) {
          GROUPS_READY[k] = s;
          return s;
        });
    }
    return GROUPS[k];
  }

  function groupCacheKey(t, g, year) {
    return t + ":" + year + ":" + (MANIFEST.tiers[t].single ? "*" : g);
  }

  function loadBase(t, year) {

        DATA_BASE + MANIFEST.tiers[t].prefix + year + ".base.bin" + CACHEBUST,
        "NGV1").then(readSlots);
    }
    return BASES[k];
  }

  // whole contract the crosswalk rests on: parents[tier][oaRow] is a ROW INDEX
  // into that tier's own arrays. The labels files' lad[] field is NOT this —
  // it indexes a tier's alphabetical ladNames list — and using it here would
  // paint every output area with some unrelated borough's number.

    if (!PARENTS_P) PARENTS_P = fetchJson(DATA_BASE + "oa.parents.json" + CACHEBUST);
    return PARENTS_P;
  }

  //

  // indexes the WARD tier's own alphabetical ladNames list, not the borough
  // tier's code-sorted rows, and 5,158 of the 26,369 output areas disagree
  // between the two orderings. Task 1 validated `oa.parents.json` two
  // independent ways, so the mapping is composed out of it instead: every
  // output area names both its ward row and its borough row, and one pass over
  // the 26,369 of them therefore names every ward's borough.
  //

  // about which borough that is. If they do not, something upstream is broken
  // and the plateau this mapping paints would be built from the wrong parents —
  // so this THROWS rather than warning, and the boot fails loudly.
  var W2B_STATS = { wards: 0, mapped: 0, oas: 0, conflicts: 0, ok: false };

    if (!w || !b) throw new Error("crosswalk has no ward/borough parents");
    if (w.length !== b.length) throw new Error("ward/borough parent lengths differ");
    var out = new Int32Array(nWards);
    for (var i = 0; i < nWards; i++) out[i] = -1;

    for (var j = 0; j < w.length; j++) {

      if (br < 0 || br >= nBoroughs) throw new Error("borough row " + br + " out of range at OA " + j);
      if (out[wr] === -1) { out[wr] = br; mapped++; }

  var WARD2BOROUGH = null;

  // ---- the warp -----------------------------------------------------------
  // Per RING, not per feature: a ward made of an island and a mainland part
  // should have each part step back from its own neighbours, and a ring pulled
  // towards some far-away shared centre would slide sideways instead of
  // shrinking. c is the plain vertex mean — good enough for a cosmetic inset,
  // and it is stable under the ring's closing duplicate vertex (which is scaled
  // with everything else, so the ring stays closed).
  //

  // one handed in, so overwriting T.pos would leave it with nothing to animate
  // away from — the same rule paint() follows for colour and height. A new

  // sixty times a second: with the centroids cached a frame is one multiply-add
  // per ordinate and nothing else.

      if (cnt <= 0) continue;

    var ring = T.ringStart, c = ringCentroids(T);
    for (var r = 0, nr = ring.length - 1; r < nr; r++) {

  // make "the same values" look like "no change at all".

  }

  // genuine count of 65,535 at a coarse area type reading as a hole.
  function shownValue(i, m, vals, base, nd) {
    var raw = vals[i];
    if (raw === nd) return null;
    if (raw !== raw) return null;
    if (m.kind === "value") return decode(raw, m);
    var b = base[m.denom][i];
    if (b <= 0) return null;
    return (raw / b) * 100;
  }

    if (T.base.residents[i] <= 0) return true;
    var b = T.base[m.denom][i];
    return b <= 0 || b < MIN_BASE[m.denom];
  }

  // itself; kept because polyLayer's transition block is production's, and the

  function easeLateFade(t) {
    return t < 0.62 ? 0 : easeCubicInOut((t - 0.62) / 0.38);
  }

    // the values it already holds to the ones handed in, so writing over the
    // same arrays in place leaves it with nothing to animate away from.
    var col = new Uint8ClampedArray(T.header.nVerts * 4);
    var elev = new Float32Array(T.header.nVerts);

    // of their bars and have to move with them during a transition, which means
    // knowing both where each bar is going and where it came from.
    var elevF = new Float32Array(T.header.nFeatures);
    T.col = col; T.elev = elev;
    T.elevFPrev = T.elevF || elevF;
    T.elevF = elevF;

    var cache = new Map();
    for (var r = 0, nr = ring.length - 1; r < nr; r++) {

      var v = suppressed(f, m, T) ? null : shownValue(f, m, vals, T.base, sentinel);

  // THE MORPH PAYLOAD. Paint one tier's polygons with ANOTHER tier's values —
  // each basis feature taking the value of the parent area it sits inside.
  //
  // Because every tier was dissolved from these same output areas on a shared
  // grid, and because the colour and height domains are shared across tiers,
  // the result is not an approximation of the parent tier's map: it IS that
  // map. The children of one borough form a single plateau at exactly the
  // borough bar's height and colour, with exactly its silhouette, and the
  // internal edges are buried inside the solid. Swapping the borough layer for
  // this one is therefore a pixel-identical exchange — which is what makes it
  // safe to then animate the values and have the reader see a split.
  //

  // denominators: a suppressed parent hands its NODATA colour and zero height
  // to every one of its children, exactly as its own bar would be drawn.
  // Evaluating suppression per child would put holes in the middle of a
  // plateau that the parent's map does not have, and the swap would flicker.

  function paintFrom(basisT, parentT, parentVals, parentNd, m, parentIdx) {
    if (parentIdx === null) return paint(basisT, parentVals, m, parentNd);

    // 33 boroughs, so this turns the work into a lookup.
    var nP = parentT.header.nFeatures;
    var pc = new Array(nP), pe = new Float32Array(nP);
    var ndCol = NODATA_COLOR;

    // feature order, so the memo lands on the same representative colour for
    // each bucket that the parent tier's own paint chose. Anything else would
    // be a one-bucket colour difference in the "pixel-identical" swap.
    var cache = new Map();
    for (var p = 0; p < nP; p++) {
      var v = suppressed(p, m, parentT) ? null
            : shownValue(p, m, parentVals, parentT.base, parentNd);
      if (v === null) { pc[p] = ndCol; pe[p] = 0; continue; }
      var key = Math.round(v * 64);
      var pcol = cache.get(key);

    basisT.elevF = elevF;

  }

  // ---- layers -------------------------------------------------------------
  var lighting = new deck.LightingEffect({
    ambient: new deck.AmbientLight({ color: [255, 255, 255], intensity: 1.05 }),
    sun: new deck.DirectionalLight({ color: [255, 250, 240], intensity: 1.3,
                                     direction: [-2, -4, -1.2] })
  });

  function thamesLayer() {
    return new deck.GeoJsonLayer({
      id: "thames", data: ORIENT.thames, filled: true, stroked: false,
      getFillColor: [40, 56, 76, 255]
    });
  }
  var BOROUGH_LINE = [22, 32, 45, 235];

  function boroughCasing() {
    return new deck.GeoJsonLayer({
      id: "boroughs-casing", data: ORIENT.boroughs, filled: false, stroked: true,
      getLineColor: mode === "street" ? [255, 255, 255, 130] : [190, 206, 224, 105],
      getLineWidth: 190, lineWidthMinPixels: 4, lineWidthMaxPixels: 9,
      parameters: { depthTest: false },
      updateTriggers: { getLineColor: mode }

    return new deck.GeoJsonLayer({
      id: "boroughs", data: ORIENT.boroughs, filled: false, stroked: true,
      getLineColor: BOROUGH_LINE,

      // reads over the extrusions instead of being buried by them.
      parameters: { depthTest: false }

      id: "borough-labels", data: ORIENT.labels.features,
      getPosition: function (f) { return f.geometry.coordinates; },
      getText: function (f) { return f.properties.name; },
      getSize: 11.5, getColor: [186, 198, 212, 225],

  var curElevScale = 1;

  // clothes, and the morph then slides out of whatever the seed was supposed to
  // have replaced. One millisecond is a real duration, so it is honoured, and it
  // completes on the frame after the one that starts it.
  var SNAP_MS = 1;

  // The binary data object for one tier, CACHED AND REBUILT ONLY WHEN A PAINT
  // OR A WARP HAS REPLACED THE BUFFERS. Ported from v1, where it was found:
  // deck.gl reads a fresh data.attributes object as the attributes having
  // changed, so handing it a new one on every redraw() restarts whatever
  // transition is in flight — from wherever it has got to, re-eased over a full
  // duration. Measured in v1: a frame 70% through a 3-second morph sits 91%
  // across normally, and 28% across if a bare redraw() lands 30% of the way in.
  //
  // v2 animates POSITIONS as well, so the key is both counters. T.phase is
  // bumped by every painter, T.posPhase by every position swap, and by nothing
  // else — so this invalidates exactly when the buffers are genuinely new, which
  // is exactly when a transition SHOULD start. A merge's second phase moves the
  // outlines without repainting a single colour, and it is posPhase alone that
  // gets it a new data object.
  function polyData(T) {

      T.dataPos = T.posPhase;
      T.data = {
        length: T.header.nRings,
        startIndices: T.ringStart,

          getPolygon: { value: T.pos, size: 2 },
          getFillColor: { value: T.col, size: 4, normalized: true },
          getElevation: { value: T.elev, size: 1 }

      id: "poly-" + T.key,
      visible: visible,
      elevationScale: curElevScale,

      updateTriggers: {

        getElevation: T.key + ":" + m.key + ":" + (T.phase || 0),

        // phase moves every vertex while leaving every colour and height alone;
        // if the position trigger carried the paint counter it would not change
        // there, and the outlines would heal by cutting instead of sliding.
        getPolygon: T.key + ":" + (T.posPhase || 0)
      },

      // The seed and the finalise of a morph are both meant to be invisible
      // exchanges, so they need a way to say "put this on screen now". Two ways
      // to say it, and only one of them works:
      //
      //   * `transitions: {}` — no transitions object at all. The paint lands
      //     instantly and looks perfect, and it costs the attribute its
      //     transition state: the NEXT paint of that attribute does not
      //     interpolate either, so the morph cuts to its destination instead of
      //     sliding to it. Measured, and it is silent — the map ends up exactly
      //     right, just instantly.
      //   * `duration: 0` inside the normal transitions object — the shape of
      //     the prop never changes, so deck.gl keeps tracking the attribute and
      //     keeps the buffer it will interpolate FROM. The seed still lands in
      //     one frame, and the animate that follows starts from the seeded
      //     values, which is the whole trick.
      //

      // TRANSITION` is kept for the animated case, and is exactly why a caller

      // would silently animate over the full 750 ms. redraw() clears T.snap
      // once the layer that consumed it has been built.
      //

      // transitions object that breaks the chain.)
      transitions: TRANSITION ? polyTransitions(T) : {}

  // from the URL — see POS_TRANS.
  // THE TRANSITIONS OBJECT STAYS POPULATED, ALWAYS, AND NEVER MENTIONS
  // getPolygon. Both halves of that are measured:
  //
  //   * with getPolygon in it, the layer draws nothing at all (the spike).
  //   * with an EMPTY object, the layer is fine until a position swap and then
  //     draws nothing either — this time with no WebGL error at all. `{}` on
  //     its own is harmless (0.0008/255); it is `{}` plus moving a vertex that
  //     blanks it.

  // deck.gl reliably draws positions that were swapped in, which is what the
  // whole CPU warp rests on.
  function polyTransitions(T) {

      getElevation: { duration: T.snap ? SNAP_MS : (T.dur || TRANSITION),

    };

    // at all is the question the whole experiment hangs on: it is declared
    // `type: "float64"` with fp64 on under LNGLAT, so the buffer deck actually
    // tweens is a high/low Float32 pair rather than the Float64Array handed in.
    // Snapping obeys the same rule as the other two — SNAP_MS, not a missing
    // entry, or the attribute would lose its transition state and the next warp
    // would cut.
    if (POS_TRANS) {
      t.getPolygon = { duration: T.snap ? SNAP_MS : (T.dur || TRANSITION),

  // harness is here to measure.
  function startPulse() {}
  function stopPulse() {}
  function pulseLayer() { return null; }

  // polygons — is enough to make a 60 fps animation visibly stutter.
  var LAYER_CACHE = null;

  }

  // stand-in layer is the only one drawn, and the tier it is standing in for is
  // not. buildStack and the warp loop's single-layer redraw have to agree about
  // this or a frame of the animation would show the wrong layer.
  function polyVisible(t) {

  // sixty frames a second that means rebuilding six polygon layers, the two
  // borough outline layers and a collision-filtered TextLayer every frame for
  // the sake of one moving layer — v0 measured that as enough on its own to
  // make a 60 fps animation stutter. The other layers' props have not changed,
  // so their instances are reused verbatim and deck.gl diffs them away.
  function redrawWarpFrame(T) {
    if (!LAYER_CACHE) { redraw(); return; }

    for (var i = 0; i < LAYER_CACHE.length; i++) {

  function redraw() {
    LAYER_CACHE = null;

    // it set would silently kill the transition on the next repaint.
    TIER_KEYS.forEach(function (t) { if (READY[t]) READY[t].snap = false; });
  }
  function buildStack() {
    var stack = [thamesLayer()];
    // Every resolved area type stays in the stack with only its visibility
    // flipped. Tessellating 26,369 output areas costs a few hundred
    // milliseconds and deck.gl caches it, so a morph is a uniform flip rather
    // than a rebuild — and all six are painted once at boot, hidden, so no
    // morph ever pays that cost mid-flight.
    TIER_KEYS.forEach(function (t) {

    // the borough area type — bar edges already are the outlines, and drawing
    // both gave every borough a doubled, slightly offset border — but the
    // smooth morph turned that skip into the worse artefact: the ink visibly
    // vanishing and popping back as curTier changed, judged by eye in the lab.

  var PARENTS = {};      // tier -> Int32Array-ish: OA row -> that tier's row

  // ---- zoom ---------------------------------------------------------------

  // tier switch is gone: in this harness the geography is chosen by hand.
  function applyZoom(z) {
    var s = elevScale(z);
    if (Math.abs(s - curElevScale) / curElevScale > 0.04) {

    }

  var zoomAdj = Math.min(0, Math.log2(window.innerWidth / CFG.baseWidth));

  var deckgl = new deck.DeckGL({
    container: "map",
    initialViewState: CAMERA,
    controller: { dragMode: "rotate", touchRotate: true, inertia: 250 },
    layers: [thamesLayer(), boroughLayer()],
    effects: [lighting],
    onViewStateChange: function (e) { applyZoom(e.viewState.zoom); },
    onAfterRender: onRendered

  document.getElementById("map").addEventListener("contextmenu", function (e) {
    e.preventDefault();
  });

  // ---- afterCommit --------------------------------------------------------
  // Run a callback only once deck has RENDERED the props last issued.
  //
  // This is the hinge of the whole morph. The seed paint has to be ON THE GPU
  // before the animated paint is issued, or the transition manager interpolates
  // from whatever the basis layer held before the seed — the output areas'
  // own values — and the reader sees the map jump to a fine-grained view and
  // then merge, instead of a borough map splitting.
  //
  // Implemented on deck's own onAfterRender rather than a double
  // requestAnimationFrame: rAF is a guess about deck's schedule, onAfterRender
  // is a statement from it. The queue is drained one rAF LATER, though, because
  // onAfterRender fires inside the render loop and calling setProps from in
  // there is not a contract deck.gl offers.
  //
  // CALLERS MUST ARM BEFORE THEY REDRAW — see split(). deck.gl can complete the
  // render inside setProps, and a hook added after that call has missed it.
  //
  // renderCount is not decoration: a headless browser can leave this page with
  // a live JS clock and no animation frames at all, and "renders stopped at 3"
  // is the only thing that says so out loud.
  // `frames` is how many committed renders to wait for, and it defaults to one.
  // A SNAPPED paint needs TWO. deck.gl creates the zero-duration transition on
  // the render that first sees the new values, and a transition that has only
  // been created has not yet been applied — its current value is still the OLD
  // one. Handing a second paint to the layer at that moment makes the new
  // transition interpolate from the value the snap was supposed to have
  // replaced, which for the morph means sliding out of the raw output-area map
  // rather than out of the plateau. One more frame and the snap has landed.
  //
  // THE WATCHDOG, ported from v1: a missed render must not become a stuck map.
  // A split whose seed callback never fires would leave the wards cracked open
  // and hidden behind the borough block, with no way back. The timer is
  // restarted on every committed render, so it means "nothing has been drawn
  // for 500 ms", not "this has taken 500 ms": a slow-but-progressing pipeline
  // (the seed frame re-tessellates the whole ward tier) is left alone, and only
  // a genuinely stalled one is forced through.
  //
  // `commits`, not `frames`: the HUD keeps a `frames` array in this same scope,
  // and a parameter of that name shadows it wherever this function can see it.
  var COMMIT_Q = [];
  var renderCount = 0;
  var COMMIT_WATCHDOG = 500;
  // Its own function, and that is not tidiness: `var e` inside the drain loop
  // below is function-scoped, so a timer closed over it there would fire
  // against whichever entry the loop happened to end on rather than its own.
  function armWatchdog(e) {
    clearTimeout(e.timer);
    e.timer = setTimeout(function () { fireCommit(e, true); }, COMMIT_WATCHDOG);
  }
  function afterCommit(cb, commits) {
    var e = { cb: cb, left: commits || 1, done: false, timer: null };
    armWatchdog(e);
    COMMIT_Q.push(e);
  }
  function fireCommit(e, late) {
    if (e.done) return;
    e.done = true;
    clearTimeout(e.timer);
    var i = COMMIT_Q.indexOf(e);
    if (i >= 0) COMMIT_Q.splice(i, 1);
    if (late) logPhase("watchdog");

  function onRendered() {
    renderCount++;
    if (!COMMIT_Q.length) return;
    var q = COMMIT_Q;
    COMMIT_Q = [];
    requestAnimationFrame(function () {
      for (var i = 0; i < q.length; i++) {
        var e = q[i];
        if (e.done) continue;
        if (--e.left > 0) { armWatchdog(e); COMMIT_Q.push(e); continue; }
        fireCommit(e, false);
      }
    });
  }

  // ---- the morph ----------------------------------------------------------
  // A token, not a boolean: a second click part-way through the first morph
  // must retire the first one's pending callbacks rather than let them fire
  // late and stamp the wrong geography onto the map.
  var MORPH = { token: 0, timer: null };
  var MORPH_LOG = [];
  var morphT0 = 0;

  function logPhase(name) {
    MORPH_LOG.push(name + "+" + Math.round(performance.now() - morphT0));
    if (MORPH_LOG.length > 8) MORPH_LOG = MORPH_LOG.slice(-8);
    setMeta();
  }

  // ---- the numbers the choreography reads ---------------------------------
  function numOf(id, dflt) {
    var v = parseInt(document.getElementById(id).value, 10);
    return (isFinite(v) && v > 0) ? v : dflt;
  }
  function floatOf(id, dflt) {
    var v = parseFloat(document.getElementById(id).value);
    return (isFinite(v) && v > 0 && v <= 1) ? v : dflt;
  }
  function insetS() { return floatOf("inset", 0.92); }
  function insetM() { return floatOf("insetM", 0.94); }
  // One duration per BEAT, shared by both directions: the values beat, the
  // seams-opening beat and the seams-closing beat.
  function valDur() { return numOf("durVal", 750); }
  function openDur() { return numOf("durOpen", 400); }
  function healDur() { return numOf("durHeal", 350); }

  // The warp tier painted as the BOROUGHS are drawn: every ward taking its own
  // borough's colour and height. This is v0's plateau claim one tier coarser —
  // the wards of one borough form a single block at exactly that borough's bar
  // height and colour — and it is what makes the merge's landing invisible.
  function paintPlateau() {
    paintFrom(READY[WARP], READY[PARENT], VALS[PARENT].vals, VALS[PARENT].nd,
              activeMeasure(), WARD2BOROUGH);
  }
  function paintTrue(T) {
    paint(T, VALS[T.key].vals, activeMeasure(), VALS[T.key].nd);
  }

  // Every choreography starts the same way: retire anything in flight — the
  // pending commits, the chained timer AND the rAF loop — take a fresh token,
  // and zero the clock the phase log is written against.
  function begin(name) {
    MORPH.token++;
    clearTimeout(MORPH.timer);
    MORPH.timer = null;
    cancelWarp();
    morphT0 = performance.now();
    MORPH_LOG = [name];
    return MORPH.token;
  }

  // ---- THE CPU WARP LOOP --------------------------------------------------
  //
  // deck.gl will not tween this attribute — declaring a getPolygon transition
  // blanks the layer outright, which is the spike's whole finding and is still
  // reproducible under ?postrans=1. What deck.gl DOES do, exactly and every
  // time, is draw whatever positions it is handed: a swapped-in buffer lands
  // pixel-identically to a first draw of the same geometry (measured at
  // 0.0002/255). So the interpolation moves to this side of the fence. Every
  // frame: evaluate the easing, build the warped buffer, hand it over, draw.
  //
  // The cost is real and it is measured rather than hoped at — see WANIM and
  // the fps readouts in the HUD and #v2meta. Per frame, at ward grain: 101,476
  // ordinates warped (one multiply-add each, centroids cached), a 811 KB buffer
  // allocated, and deck.gl re-tessellating 689 features because the geometry
  // changed. That last item is the expensive one and it is not avoidable —
  // moving a vertex invalidates the triangulation deck is holding.
  var WANIM = { raf: 0, tok: 0, frames: 0, worst: 0, ema: 0, ms: 0, dur: 0,

    if (WANIM.raf) cancelAnimationFrame(WANIM.raf);
    WANIM.raf = 0;
    WANIM.running = false;
    WANIM.tok++;
  }
  // POSITIONS ONLY, AND THAT IS A MEASURED LIMIT RATHER THAN A CHOICE.
  //
  // The intent was to animate the values on this same clock, or failing that to
  // leave them on deck.gl's transitions running concurrently. Neither works:
  //
  //   * CPU-lerped values handed over per frame NEVER REACH THE SCREEN. Any
  //     attribute deck.gl holds in transition is drawn from the transition's own
  //     buffer, and a new value every frame means each transition supersedes the
  //     last before it was ever applied. Measured with the outlines held still
  //     and only the colours lerped: 0.01% of the way across at u = 0.64. Tried
  //     at durations from 1 ms to 750 ms and with the colour trigger held
  //     constant — no configuration lands. Against a STATICALLY rendered u = 0.5
  //     picture of the same choreography, the live half-way frame sat 19.5%
  //     across where the static one sat 59.2%, 2.76/255 apart.
  //   * taking the values out of `transitions` so they are drawn literally
  //     blanks the layer the moment a vertex moves (see polyTransitions).
  //   * leaving them on deck's transitions CONCURRENTLY stops them moving at
  //     all while the outlines are moving: every position frame restarts the
  //     ease. `?concurrent=1` is that arm, kept reachable so the driver can
  //     re-measure it every run rather than quote a number from a probe — at
  //     the 79% mark of the ease the values are a few per cent across where a
  //     working transition would be at ~97%. They do arrive, but only once the
  //     loop stops restarting them, which is after the animation has ended: the
  //     destination is right and the motion is wrong.
  //
  // So the outlines and the values take turns. Each beat of the choreography
  // moves one or the other, never both, and every beat therefore runs on a
  // mechanism this sprint has proof for.
  //
  // The stats describe ONE beat and are reset by the next: an average taken
  // across a split and the merge that followed it would describe neither.
  function animateWarp(T, from, to, dur, ease, done) {

      // click, the seed paint and the first tessellation — so it is counted
      // but kept out of the average, which is here to say what the LOOP costs.
      var dt = now - last;
      last = now;

        WANIM.fps = WANIM.ms > 0 ? (WANIM.frames * 1000) / WANIM.ms : 0;
        WANIM.raf = 0;
        WANIM.running = false;

  // ---- SPLIT: borough -> ward ---------------------------------------------

  //             gap of ground along every ward boundary. Snapped, so it is a
  //             cut, and it is MEANT to be seen.

  // 3. HEAL   — the seams close (the CPU loop, the only path there is)

  // happens when the outlines and the values are asked to move together.
  function split() {
    if (!ready) return;

    // deck.gl had no reason to draw, the two commits never came, and the crack
    // arrived only when the 500 ms watchdog forced it through. Measured on
    // every run of the previous build: `watchdog+545`.

    // frame IS the crack — the warped plateau, snapped — which is where the
    // choreography wanted to start anyway, so nothing is lost. The visibility
    // change gives deck something to draw, the commits flow, and the watchdog
    // stays out of it: `crack+6`.
    W.snap = true;

    paintPlateau();
    morphBasis = WARP;
    curTier = WARP;

    // statements is the whole point. deck.gl can service a setProps that changes
    // the layer stack DURING the call — onAfterRender has already fired by the
    // time setProps returns — so a hook registered afterwards is waiting for a
    // render that has already happened. v0 measured what that costs: with
    // nothing else on screen moving, deck has no reason to draw again and the
    // choreography stops dead with no error anywhere.
    //
    // (It survived being the other way round in this build only by luck: the
    // one-millisecond snap issued just above guarantees another render or two,
    // and the watchdog would have forced it through regardless. Neither is a
    // reason to rely on the order being wrong.)
    //

    // out of a transition that has been created and not applied means animating
    // out of the values the snap was supposed to have replaced.
    afterCommit(function () {

      // held open. Nothing moves geometrically for the length of this beat,
      // which is exactly the condition under which that transition is the
      // proven path v0 and v1 measured.
      W.dur = dv;
      W.ease = easeCubicInOut;

      logPhase("values");

      // build is here to show does not work. The outlines go to the rAF loop
      // and the values are left on the transition just issued; every position
      // frame restarts that transition, so the colours crawl and the map is
      // still short of the ward values when the choreography says it is done.
      if (CONCURRENT) {

          if (tok !== MORPH.token) return;
          W.dur = null;
          W.ease = null;
          morphBasis = null;
          redraw();
          logPhase("finalise");
          setStatus();
        });
        setStatus();
        return;
      }

        if (tok !== MORPH.token) return;
        W.dur = null;
        W.ease = null;
        // BEAT 3 — THE SEAMS HEAL, on the CPU loop, with the values now still.
        logPhase("heal");
        animateWarp(W, s, 1, dh, easeCubicInOut, function () {
          if (tok !== MORPH.token) return;
          // FINALISE, and there is nothing to hand back to: the layer that has
          // been animating IS the ward layer, so clearing morphBasis changes
          // which name is on screen and not one pixel of it.
          morphBasis = null;
          redraw();
          logPhase("finalise");
          setStatus();
        });
        setStatus();
      }, dv + 60);
      setStatus();
    }, 2);

    // The redraw the arm above is waiting on. The layer becomes visible here,
    // which is the crack.
    redraw();
    logPhase("crack");
    setStatus();
  }

  // ---- MERGE: ward -> borough ---------------------------------------------
  // The split played backwards, and beat for beat the same mechanisms:
  // 1. OPEN   — the seams open to s, values untouched (the CPU loop)
  // 2. VALUES — the wards converge on their boroughs' colours and heights while
  //             the seams stay open (deck.gl's transition)
  // 3. HEAL   — the seams close into one solid block (the CPU loop)

  function merge() {
    if (!ready) return;

    // geography being REPRESENTED, and from this moment that is the borough.

    morphBasis = WARP;
    curTier = PARENT;

    animateWarp(W, 1, s, dopen, easeCubicInOut, function () {
      if (tok !== MORPH.token) return;
      W.dur = dv;
      W.ease = easeCubicInOut;

      redraw();
      logPhase("values");
      MORPH.timer = setTimeout(function () {
        if (tok !== MORPH.token) return;
        W.dur = null;
        W.ease = null;
        logPhase("heal");

          if (tok !== MORPH.token) return;

          // handing back to the real borough layer is an exchange of two
          // identical pictures. It is snapped as it is shown, for the
          // first-draw reason above.
          var P = READY[PARENT];
          P.snap = true;
          paintTrue(P);
          morphBasis = null;
          curTier = PARENT;
          redraw();
          logPhase("finalise");
          setStatus();
        });
        setStatus();

  // ---- the warp on its own ------------------------------------------------
  // THE SPIKE'S OWN MEASUREMENT, kept as a control. The wards keep their own
  // values and their own colours from start to finish, so nothing on screen can
  // move for any reason except that the OUTLINES moved — which is the whole
  // question this experiment was gated on, and now the assertion the CPU path
  // has to pass. warpTo animates on the rAF loop, warpSnap cuts (the driver
  // needs both: two snapped endpoints to measure a tween against).
  function warpTo(s, dur) {
    if (!ready) return;

    var tok = begin("warp->" + s);
    var d = dur || healDur();
    var from = W.posS;
    logPhase("animate");
    animateWarp(W, from, s, d, easeCubicInOut, function () {
      if (tok !== MORPH.token) return;
      logPhase("finalise");
      setStatus();
    });
    setStatus();
  }
  function warpSnap(s) {
    if (!ready) return;
    var W = READY[WARP];
    if (curTier !== WARP || morphBasis) show(WARP);
    begin("snap->" + s);
    W.snap = true;
    setPos(W, s);
    redraw();
    logPhase("snap");
    setStatus();
  }

  // ---- lab controls -------------------------------------------------------
  var buttons = [];
  function buildControls() {
    var out = document.getElementById("insetOut"), inset = document.getElementById("inset");
    function showInset() { out.textContent = insetS().toFixed(3); }
    inset.addEventListener("input", showInset);
    showInset();
    [["bSplit", split], ["bMerge", merge],
     // The panel's spike button toggles: warp in if the wards are true, back
     // out if they are not.
     ["bSpike", function () { warpTo(READY[WARP].posS >= 1 ? insetS() : 1); }]
    ].forEach(function (p) {
      var b = document.getElementById(p[0]);
      b.addEventListener("click", p[1]);
      buttons.push(b);
    });
  }

  // ---- HUD ----------------------------------------------------------------
  // Its own rAF loop, and it MUST NOT touch deck: a setProps per frame is
  // exactly the cost this is here to detect.
  var hudEl = document.getElementById("hud");
  var frames = [], ema = 0, lastTs = 0, lastPaintMs = 0, lastWarpMs = 0, tickCount = 0;
  function hudText() {
    var worst = 0;
    for (var i = 0; i < frames.length; i++) if (frames[i][1] > worst) worst = frames[i][1];
    hudEl.textContent =
      "t " + Math.round(performance.now()) + " ms   frame " + ema.toFixed(1) +
      " ms ema   worst/2s " + worst.toFixed(1) + " ms\n" +
      "paint " + lastPaintMs.toFixed(1) + " ms   warp " + lastWarpMs.toFixed(1) +
      " ms   tier " + curTier + (morphBasis ? "  drawn " + morphBasis : "") + "\n" +
      "inset " + (READY[WARP] ? READY[WARP].posS.toFixed(3) : "-") + "   pos " +
      (POS_F32 ? "f32" : "f64") +
      (WANIM.frames ? "   warp " + WANIM.fps.toFixed(1) + " fps (" +
        WANIM.frames + " fr, ema " + WANIM.ema.toFixed(1) + " worst " +
        WANIM.worst.toFixed(1) + " ms)" : "") + "\n" +
      (ready ? MORPH_LOG.join("  ") : "loading…");
    setStatus();
    setMeta();
  }
  function hudTick(ts) {
    tickCount++;
    if (lastTs) {
      var dt = ts - lastTs;
      ema = ema ? ema * 0.9 + dt * 0.1 : dt;
      frames.push([ts, dt]);
      while (frames.length && ts - frames[0][0] > 2000) frames.shift();
    }
    lastTs = ts;
    hudText();
    requestAnimationFrame(hudTick);
  }

  // Timing without touching the production bodies: both painters are wrapped in
  // place, so every call site is measured and paint() itself stays as it is in
  // the page this code is going back into.
  paint = (function (inner) {
    return function () {
      var t0 = performance.now();
      var r = inner.apply(null, arguments);
      lastPaintMs = performance.now() - t0;
      return r;
    };
  })(paint);
  paintFrom = (function (inner) {
    return function () {
      var t0 = performance.now();
      var r = inner.apply(null, arguments);
      lastPaintMs = performance.now() - t0;
      return r;
    };
  })(paintFrom);

  // ---- status / test hooks ------------------------------------------------
  var ready = false;
  var readyAt = 0;
  var lastStatus = "";
  // Looked up per call, not cached: this runs from noteError, which is armed
  // before anything else in the script and has to survive a failure that
  // happens before the rest of it has run.
  // The crosswalk assertion is reported here rather than only thrown, so the
  // driver can assert the mapping was CHECKED and not merely that the page
  // failed to fall over. `s` is the warp tier's current inset, and it is the
  // one number that says what the outlines are doing.
  function setStatus() {
    var el = document.getElementById("v2status");
    if (!el) return;
    var W = READY[WARP];
    var s = JSON.stringify({ ready: !!ready, errors: LAB_ERRORS.length,
                             tier: curTier, drawn: morphBasis,
                             s: W ? Math.round(W.posS * 1000) / 1000 : null,
                             posPhase: W ? (W.posPhase || 0) : 0,
                             w2b: !!W2B_STATS.ok });
    if (s !== lastStatus) { lastStatus = s; el.textContent = s; }
  }
  function setMeta() {
    var W = READY[WARP];
    document.getElementById("v2meta").textContent = JSON.stringify({
      readyAt: Math.round(readyAt), transition: TRANSITION,
      t0: Math.round(morphT0),
      dur: ready ? valDur() : null,
      d1: ready ? openDur() : null, d2: ready ? healDur() : null,
      inset: ready ? insetS() : null, insetM: ready ? insetM() : null,
      pos: POS_F32 ? "f32" : "f64",
      paintMs: Math.round(lastPaintMs * 10) / 10,
      warpMs: Math.round(lastWarpMs * 10) / 10,
      // THE COST OF THE CPU WARP, for the last warp only. `fps` is the whole
      // loop's own rate; `ema`/`worst` are frame INTERVALS in ms with the first
      // one excluded, because that interval spans the click and the first
      // tessellation and describes the seed rather than the animation.
      warp: { fps: Math.round(WANIM.fps * 10) / 10,
              frames: WANIM.frames,
              ema: Math.round(WANIM.ema * 10) / 10,
              worst: Math.round(WANIM.worst * 10) / 10,
              ms: Math.round(WANIM.ms), dur: WANIM.dur,
              running: WANIM.running },
      nWards: W ? W.header.nFeatures : null,
      nVerts: W ? W.header.nVerts : null,
      w2b: W2B_STATS,
      now: Math.round(performance.now()),
      renders: renderCount, ticks: tickCount, queued: COMMIT_Q.length,
      log: MORPH_LOG
    });
  }

  // show(t): the real tier t, at its own values and its TRUE outlines, no
  // transition. The position half is v2's: a tier left part way through a warp
  // by an interrupted choreography is not the tier, and every caller of show()
  // means "the geography as it is".
  function show(t) {
    if (!MANIFEST.tiers[t] || !READY[t]) return;
    MORPH.token++;
    clearTimeout(MORPH.timer);
    MORPH.timer = null;
    // The rAF loop has its own token and would otherwise keep warping the
    // outlines out from under the tier this is putting on screen.
    cancelWarp();
    var T = READY[t];
    T.snap = true;
    T.dur = null;
    T.ease = null;
    if (T.posS !== 1) setPos(T, 1);
    paint(T, VALS[t].vals, activeMeasure(), VALS[t].nd);
    morphBasis = null;
    curTier = t;
    redraw();
    setStatus();
  }

  window.__v2 = {
    errors: LAB_ERRORS,
    state: function () {
      return { tier: curTier, drawn: morphBasis, log: MORPH_LOG,
               s: READY[WARP] ? READY[WARP].posS : null,
               phase: (READY[WARP] && READY[WARP].phase) || 0 };
    },
    show: show,
    split: split,
    merge: merge,
    warpTo: warpTo,
    warpSnap: warpSnap
  };

  // ---- boot ---------------------------------------------------------------
  // Every control can also be set from the URL, which is how the capture driver
  // asks for a deliberately slow warp it can photograph half way through. The
  // inset slider clamps to its own min/max, so ?s= outside 0.85–0.98 lands on
  // the nearest end rather than being honoured silently.
  var Q_NUM = [["dur", "durVal"], ["d1", "durOpen"], ["d2", "durHeal"]];
  var Q_FLT = [["s", "inset"], ["sm", "insetM"]];
  function applyQuery() {
    Q_NUM.forEach(function (p) {
      var v = parseInt(params.get(p[0]), 10);
      if (isFinite(v) && v > 0) document.getElementById(p[1]).value = v;
    });
    Q_FLT.forEach(function (p) {
      var v = parseFloat(params.get(p[0]));
      if (isFinite(v) && v > 0 && v <= 1) document.getElementById(p[1]).value = v;
    });
  }
  applyQuery();
  buildControls();
  setStatus();
  setMeta();
  requestAnimationFrame(hudTick);
  // KEEP-ALIVE, and it is load-bearing rather than cosmetic. A headless browser
  // under --virtual-time-budget stops issuing animation frames the moment it
  // decides the page has nothing to repaint — and once it has stopped, a page
  // whose only source of repaints IS requestAnimationFrame can never start it
  // again. The JS clock races on, timers keep firing, and rAF is simply never
  // called: deck.gl's entire render loop is rAF, so every transition dies
  // silently and no frame is ever composited again.
  //
  // This timer breaks that deadlock from outside rAF, by writing a VISIBLE node
  // (the HUD carries the page clock, so the text genuinely changes): a visible
  // change is damage, damage forces a frame, and a frame delivers rAF. It also
  // keeps the status and meta nodes truthful in the one situation where the
  // driver most needs them — after the frames have stopped.
  setInterval(hudText, 100);

  // The font is a boot dependency, not a nicety: the TextLayer bakes an SDF
  // atlas from whatever is available the first time it is built.
  var FONTS = document.fonts.load("600 16px 'DM Sans'")
    .then(function () { return document.fonts.ready; })
    .catch(function (e) { noteError("font load failed: " + e); });

  // EVERY tier, up front — geometry, denominators and values for the one fixed
  // measure — plus the crosswalk. About 3 MB off a local server, and it buys
  // the thing the morph cannot do without: nothing is fetched, decoded or
  // tessellated once a morph has started.
  Promise.all(TIER_KEYS.map(function (t) {
    return Promise.all([loadTier(t), loadGroup(t, groupKey, YEAR)])
      .then(function (p) {
        READY[t] = p[0];
        VALS[t] = { vals: p[1][measureKey], nd: p[1].__nodata[measureKey] };
        if (!VALS[t].vals) throw new Error(t + ": no slot for " + measureKey);
      });
  }).concat([
    loadParents().then(function (j) {
      if (j.basis !== BASIS) throw new Error("parents basis is " + j.basis);
      Object.keys(j.parents).forEach(function (k) { PARENTS[k] = j.parents[k]; });
    }),
    FONTS
  ])).then(function () {
    var n = READY[BASIS].header.nFeatures;
    TIER_KEYS.forEach(function (t) {
      if (t === BASIS) return;
      var pa = PARENTS[t];
      if (!pa) throw new Error("no parents for " + t);
      if (pa.length !== n) throw new Error(t + ": " + pa.length + " parents for " + n + " OAs");
    });
    // THE WARD -> BOROUGH MAPPING, composed here and asserted here. One pass
    // over the 26,369 output areas; a ward that came out with two different
    // boroughs throws and takes the boot down with it.
    WARD2BOROUGH = buildWardToBorough(
      { ward: PARENTS[WARP], borough: PARENTS[PARENT] },
      READY[WARP].header.nFeatures, READY[PARENT].header.nFeatures);
    if (HAS_S0) setPos(READY[WARP], S0);

    // All six painted once and snapped, and all six left in the layer stack
    // from here on with only their visibility flipped, so deck.gl keeps the
    // tessellation and a morph is a uniform flip rather than a rebuild.
    var m = activeMeasure();
    TIER_KEYS.forEach(function (t) {
      var T = READY[t];
      T.snap = true;
      paint(T, VALS[t].vals, m, VALS[t].nd);
    });

    // WARM THE WARP TIER: one drawn frame, alone, snapped so nothing moves.
    // Painting a layer is cheap; DRAWING it for the first time is not, because
    // that is when deck.gl tessellates it and uploads its buffers. v0 warmed the
    // output areas because that was the layer it stood in for a coarser tier
    // with; v2's stand-in is the WARD layer, and it is the ward layer whose
    // first draw would otherwise land on the split's seed frame.
    //
    // (What this cannot pre-pay is the RE-tessellation a warp forces: moving
    // every vertex invalidates the triangulation deck is holding, so the seed
    // pays for one more pass over the wards. It is ~600 features rather than
    // 26,369, and the HUD's paint/warp readouts say what it costs.)
    var B0 = READY[WARP];
    B0.snap = true;
    curTier = WARP;
    morphBasis = null;
    afterCommit(function () {
      // ?s0= lands the boot on the warp tier instead, still warped: that IS the
      // picture it was asked for.
      var landing = HAS_S0 ? WARP : PARENT;
      READY[landing].snap = true;
      curTier = landing;
      morphBasis = null;
      afterCommit(function () {
        readyAt = performance.now();
        ready = true;
        buttons.forEach(function (b) { b.disabled = false; });
        setStatus();
        setMeta();
        autoMode();
      }, 2);
      redraw();
    }, 2);
    redraw();
  }).catch(function (e) {
    noteError(e);
    hudEl.textContent = "FAILED: " + String((e && e.message) || e);
  });

  // ---- headless auto-modes ------------------------------------------------
  // ?show=<tier>
  // ?spike=warp|true|tween   (&s= &dur= &when=|&at=)   positions only
  // ?warp=split|merge        (&when=|&at=)             the choreography
  //
  // `when` is a delay after ready. `at` is the same thing said as an absolute
  // page-clock deadline, and it is what the capture driver uses: a screenshot
  // budget has to be decided before the run starts, and how long the load takes
  // is not knowable then — 3 MB and six tessellations vary by seconds between
  // runs on the same machine.
  function deferred(fn) {
    var at = parseInt(params.get("at"), 10);
    var delay = isFinite(at) ? Math.max(0, at - performance.now())
                             : (parseInt(params.get("when"), 10) || 0);
    setTimeout(fn, delay);
  }
  function autoMode() {
    // ?s0= has already put its picture on screen, and show() would take the
    // outlines straight back to true.
    if (HAS_S0) return;
    var s = params.get("show");
    if (s) { show(s); return; }

    // THE SPIKE'S THREE MODES: the two endpoints of a pure position tween, and
    // the tween itself. Nothing here repaints a colour after the initial show,
    // so a driver comparing these frames is measuring outlines and only
    // outlines.
    var sp = params.get("spike");
    if (sp) {
      var dur = parseInt(params.get("dur"), 10) || healDur();
      if (sp === "true") { warpSnap(1); return; }
      if (sp === "warp") { warpSnap(insetS()); return; }
      if (sp === "tween") {
        warpSnap(insetS());
        deferred(function () { warpTo(1, dur); });
        return;
      }
      noteError("unknown ?spike= mode: " + sp);
      return;
    }

    var w = params.get("warp");
    if (w === "split" || w === "merge") {
      // Start where the choreography says it starts, instantly, so what the
      // capture times is the warp and not the boot's choice of tier.
      show(w === "merge" ? WARP : PARENT);
      deferred(w === "merge" ? merge : split);
    } else if (w) {
      noteError("unknown ?warp= mode: " + w);
    }
  }
  </script>
</body>
</html>
