<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapping London's Population — Census 2021 in 3D</title>
<style>
  @font-face {
    font-family: 'Libre Baskerville';
    src: url(/fonts/LibreBaskerville.ttf) format('truetype');
    font-weight: 400 700; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url(/fonts/DMSans.ttf) format('truetype');
    font-weight: 300 700; font-style: normal; font-display: block;
  }

  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { background: #1A2332; font-family: 'DM Sans', sans-serif; }
  #map { position: absolute; inset: 0; }
  #map canvas { outline: none; }

  .scrim { position: absolute; left: 0; right: 0; z-index: 5; pointer-events: none; }
  .scrim.bottom {
    bottom: 0; height: 215px;
    background: linear-gradient(to top, rgba(26, 35, 50, 0.94), rgba(26, 35, 50, 0));
  }

  .card {
    position: absolute; top: 22px; left: 24px; z-index: 10;
    max-width: min(430px, calc(100vw - 48px));
    pointer-events: none; color: #F3F6F4;
    background: rgba(26, 35, 50, 0.74); border-radius: 10px;
    padding: 14px 16px 16px; margin: -14px -16px;
  }
  .card .eyebrow {
    display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: #5A9FD4; margin-bottom: 6px;
  }
  .card .eyebrow::after {
    content: ""; display: block; width: 34px; height: 3px;
    background: #5A9FD4; margin-top: 6px;
  }
  .card h1 {
    font-family: 'Libre Baskerville', serif; font-weight: 700;
    font-size: clamp(18px, 3.1vw, 25px); line-height: 1.22; margin: 10px 0 8px;
    transition: opacity 0.22s ease;
  }
  .card .subtitle {
    font-size: clamp(12px, 1.9vw, 13.5px); line-height: 1.45;
    color: #B9C2CE; margin: 0; transition: opacity 0.22s ease;
  }
  /* Indeterminate bar under the title, shown only when a fetch outlasts the
     patience threshold — a flash on every cached switch reads as jank. */
  .card .loading {
    height: 2px; margin-top: 10px; border-radius: 2px; overflow: hidden;
    background: rgba(90, 159, 212, 0.22); opacity: 0; transition: opacity 0.2s ease;
  }
  .card .loading.on { opacity: 1; }
  .card .loading::after {
    content: ""; display: block; width: 38%; height: 100%; background: #5A9FD4;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); } 100% { transform: translateX(300%); }
  }

  .controls {
    position: absolute; left: 24px; bottom: 54px; z-index: 30;
    display: flex; flex-direction: column; gap: 8px;
    max-width: min(760px, calc(100vw - 48px));
  }
  /* Two rows, deliberately unequal in weight: the group row is a FILTER (small,
     outline, blue when active) and the measure row is the SUBJECT (larger,
     filled amber when active). Same grammar as the ward map's year/metric rows,
     so the four maps read as one family. */
  /* Map mode / layer toggles. Smallest and topmost of the three rows: these
     change the frame, not the subject, so they must not compete with the
     measure pills for attention. */
  .modebar { display: flex; flex-wrap: wrap; gap: 6px; }
  .modebar button {
    font: 600 11px 'DM Sans', sans-serif; color: #8A9490;
    background: rgba(36, 49, 66, 0.85); border: 1px solid #33404F;
    border-radius: 999px; padding: 4px 10px; cursor: pointer; white-space: nowrap;
  }
  .modebar button:hover { color: #F3F6F4; background: #34455C; }
  .groupbar { display: flex; flex-wrap: wrap; gap: 6px; }
  .groupbar button {
    font: 600 11.5px 'DM Sans', sans-serif; color: #B9C2CE;
    background: rgba(36, 49, 66, 0.85); border: 1px solid #3B4A5E;
    border-radius: 999px; padding: 5px 11px; cursor: pointer; white-space: nowrap;
  }
  .groupbar button:hover { color: #F3F6F4; background: #34455C; }
  .groupbar button.active {
    color: #F3F6F4; background: #1B5480; border-color: #5A9FD4;
  }
  .switcher { display: flex; flex-wrap: wrap; gap: 8px; }
  .switcher button {
    font: 600 12.5px 'DM Sans', sans-serif; color: #B9C2CE;
    background: rgba(36, 49, 66, 0.85); border: 1px solid #3B4A5E;
    border-radius: 999px; padding: 8px 15px; cursor: pointer; white-space: nowrap;
    transition: opacity 0.2s ease;
  }
  .switcher button:hover { color: #F3F6F4; background: #34455C; }
  .switcher button.active { color: #1A2332; background: #E0A24E; border-color: #E0A24E; }
  .switcher button.pending { opacity: 0.55; animation: pulse 1.2s ease-in-out infinite; }
  .switcher button:disabled { opacity: 0.38; cursor: not-allowed; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  .legend {
    position: absolute; right: 24px; bottom: 54px; z-index: 30;
    width: min(250px, calc(100vw - 48px)); pointer-events: none;
    background: rgba(26, 35, 50, 0.8); border-radius: 8px; padding: 10px 12px 9px;
    color: #B9C2CE;
  }
  .legend .lg-title {
    font-size: 11.5px; font-weight: 700; color: #F3F6F4; line-height: 1.3;
    margin-bottom: 7px;
  }
  .legend .lg-bar { height: 9px; border-radius: 2px; position: relative; }
  .legend .lg-bar .zero {
    position: absolute; top: -2px; bottom: -2px; left: 50%; width: 1px;
    background: #F3F6F4; opacity: 0.85;
  }
  .legend .lg-ticks {
    display: flex; justify-content: space-between; font-size: 10px;
    margin-top: 4px; font-variant-numeric: tabular-nums;
  }
  .legend .lg-dirs {
    display: flex; justify-content: space-between; font-size: 10px;
    margin-top: 2px; color: #8A9490; gap: 8px;
  }
  .legend .lg-dirs span:last-child { text-align: right; }
  .legend .lg-nd {
    display: flex; align-items: center; gap: 6px; font-size: 10px;
    margin-top: 7px; color: #8A9490;
  }
  .legend .lg-nd i {
    width: 10px; height: 10px; border-radius: 2px; display: inline-block;
    border: 1px solid #3B4A5E;
  }

  .foot {
    position: absolute; left: 24px; right: 24px; bottom: 16px; z-index: 10;
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 16px; pointer-events: none; font-size: 11px; color: #8A9490;
  }
  .foot .source { font-style: italic; }
  .foot .tag { font-weight: 700; letter-spacing: 0.08em; white-space: nowrap; }

  .hint {
    position: absolute; right: 24px; top: 22px; z-index: 10;
    font-size: 11.5px; color: #8A9490; text-align: right; pointer-events: none;
  }
  .hint b { color: #B9C2CE; font-weight: 600; }
  #reset {
    position: absolute; right: 24px; top: 52px; z-index: 30;
    font: 600 12px 'DM Sans', sans-serif; color: #F3F6F4;
    background: rgba(36, 49, 66, 0.85); border: 1px solid #3B4A5E;
    border-radius: 6px; padding: 7px 12px; cursor: pointer; display: none;
  }
  #reset:hover { background: #34455C; }

  .tt { font-size: 12.5px; line-height: 1.45; }
  .tt b { color: #E0A24E; }
  .tt .tt-where { color: #B9C2CE; font-size: 11px; letter-spacing: 0.03em; }
  .tt .tt-note { color: #8A9490; font-size: 10.5px; font-style: italic; }

  #shield {
    position: absolute; inset: 0; z-index: 20; cursor: pointer;
    display: flex; align-items: flex-end; justify-content: center; background: transparent;
  }
  #shield span {
    margin-bottom: 140px; font: 600 13px 'DM Sans', sans-serif;
    color: #F3F6F4; background: rgba(36, 49, 66, 0.9);
    border: 1px solid #3B4A5E; border-radius: 999px; padding: 9px 18px;
  }

  /* Street mode readability. Over CARTO Voyager's cream and green, light
     chrome text disappears; the scrim and the text both have to invert. */
  body.light-base .card { background: rgba(26, 35, 50, 0.92); }
  body.light-base .legend { background: rgba(26, 35, 50, 0.9); }
  body.light-base .scrim.bottom {
    background: linear-gradient(to top, rgba(243, 246, 244, 0.95), rgba(243, 246, 244, 0));
  }
  /* The mode pills are the one control a reader needs in street mode — to get
     back out of it — so they get more contrast, not less, over the pale map. */
  body.light-base .modebar button {
    color: #E8EDF2; background: rgba(26, 35, 50, 0.92); border-color: #56677D;
  }
  body.light-base .hint, body.light-base .foot span {
    color: #37485E;
    text-shadow: 0 0 6px rgba(255, 255, 255, 0.95), 0 0 2px rgba(255, 255, 255, 0.95);
  }

  @media (max-width: 700px) {
    .card { max-width: calc(100vw - 32px); left: 16px; top: 16px; }
    .controls { left: 16px; right: 16px; bottom: 46px; max-width: calc(100vw - 32px); }
    /* The group row scrolls sideways rather than collapsing to a <select>:
       eight taps stay one tap each, and the house style has no select. */
    .groupbar {
      flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch; padding-bottom: 2px;
    }
    .groupbar::-webkit-scrollbar { height: 0; }
    .groupbar button { scroll-snap-align: start; }
    .legend { display: none; }
    .hint { display: none; }
  }
</style>
</head>
<body>
  <div id="map"></div>
  <div class="scrim bottom"></div>

  <div class="card">
    <span class="eyebrow">Mapping London's population</span>
    <h1 id="title">Loading&hellip;</h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="loading" id="loading"></div>
  </div>

  <div class="hint" id="hint">drag to rotate &amp; tilt &middot; scroll to zoom &middot; right-drag to move</div>
  <button id="reset">Reset view</button>

  <div class="controls">
    <div class="modebar" id="modebar"></div>
    <div class="groupbar" id="groupbar"></div>
    <div class="switcher" id="switcher"></div>
  </div>

  <div class="legend" id="legend" style="visibility:hidden">
    <div class="lg-title" id="lgTitle"></div>
    <div class="lg-bar" id="lgBar"><span class="zero" id="lgZero" style="display:none"></span></div>
    <div class="lg-ticks" id="lgTicks"></div>
    <div class="lg-dirs" id="lgDirs" style="display:none"></div>
    <div class="lg-nd"><i id="lgNd"></i><span id="lgNdText">too few people to show</span></div>
  </div>

  <div class="foot">
    <span class="source">Source: Census 2021, Office for National Statistics (OGL v3). Boundaries: ONS / Ordnance Survey (c) Crown copyright 2024.</span>
    <span class="source" id="attrib"></span>
    <span class="tag">NEILGARRATT.COM</span>
  </div>

  <div id="shield" style="display:none"><span>Click or tap to explore in 3D</span></div>

  function paint(T, vals, m) {
    // Fresh buffers each time, not a mutated pair. deck.gl interpolates from
    // the values it already holds to the ones handed in, so writing over the
    // same arrays in place leaves it with nothing to animate away from.
    var col = new Uint8ClampedArray(T.header.nVerts * 4);
    var elev = new Float32Array(T.header.nVerts);
    T.col = col; T.elev = elev;
    var ring = T.ringStart, fo = T.featureOf;
    var nd = NODATA_COLOR;
    // Colour is memoised on the value quantised to 64 buckets per unit. That is
    // far below anything the eye resolves and cuts colorFor() calls ~40x, which
    // is what keeps a measure switch inside one frame at output-area grain.
    var cache = new Map();
    for (var r = 0, nr = ring.length - 1; r < nr; r++) {
      var f = fo[r];
      var v = suppressed(f, m, T) ? null : shownValue(f, m, vals, T.base);
      var c, e;
      if (v === null) { c = nd; e = 0; }
      else {
        var key = Math.round(v * 64);
        c = cache.get(key);
        if (c === undefined) { c = colorFor(v, m); cache.set(key, c); }
        e = elevationFor(v, m);
      }
      for (var i = ring[r], end = ring[r + 1]; i < end; i++) {
        col[4 * i] = c[0]; col[4 * i + 1] = c[1];
        col[4 * i + 2] = c[2]; col[4 * i + 3] = c[3];
        elev[i] = e;
      }
    }
    T.painted = m.key;
  }

  // ---- layers -------------------------------------------------------------
  var lighting = new deck.LightingEffect({
    ambient: new deck.AmbientLight({ color: [255, 255, 255], intensity: 1.05 }),
    sun: new deck.DirectionalLight({ color: [255, 250, 240], intensity: 1.3,
                                     direction: [-2, -4, -1.2] })
  });

  function thamesLayer() {
    return new deck.GeoJsonLayer({
      id: "thames", data: ORIENT.thames, filled: true, stroked: false,
      getFillColor: [40, 56, 76, 255]
    });
  }
  // One colour in both modes. A pale line reads well on ink but fights the
  // white tops of the tallest bars, which are exactly the places a reader is
  // looking at; dark ink wins against those and against the street map.
  var BOROUGH_LINE = [22, 32, 45, 235];

  // ...but a dark line alone disappears into the dark low-density outer
  // boroughs, where the fill is nearly as dark as the line. A wider, faint
  // pale line underneath it — a casing, the standard cartographic answer —
  // keeps the boundary readable there without lightening the line itself.
  // Invisible against the white bars, which is exactly where it isn't wanted.
  function boroughCasing() {
    return new deck.GeoJsonLayer({
      id: "boroughs-casing", data: ORIENT.boroughs, filled: false, stroked: true,
      getLineColor: mode === "street" ? [255, 255, 255, 130] : [190, 206, 224, 105],
      getLineWidth: 190, lineWidthMinPixels: 4, lineWidthMaxPixels: 9,
      parameters: { depthTest: false },
      updateTriggers: { getLineColor: mode }
    });
  }

  function boroughLayer() {
    // Kept in BOTH modes, unlike the sibling crime maps which drop their
    // district outlines over the basemap. Their hexes are a sparse overlay, so
    // the street map reads through and gives its own orientation; here the
    // areas tile the whole city, and CARTO's own borough lines are far too
    // faint at these zooms to replace the frame.
    return new deck.GeoJsonLayer({
      id: "boroughs", data: ORIENT.boroughs, filled: false, stroked: true,
      getLineColor: BOROUGH_LINE,
      getLineWidth: 70, lineWidthMinPixels: 1.6, lineWidthMaxPixels: 4,
      // Drawn LAST in the stack and with the depth test off, so the boundary
      // reads over the extrusions instead of being buried by them. A ground-
      // level outline behind a field of bars is invisible exactly where the
      // map is busiest and the reader most needs to know which borough they
      // are looking at.
      parameters: { depthTest: false }
    });
  }

  function basemapLayer() {
    return new deck.TileLayer({
      id: "basemap",
      data: CFG.basemap.url,
      extent: CFG.basemap.extent,     // don't fetch horizon tiles far from London
      minZoom: 0, maxZoom: 19, tileSize: 256,
      renderSubLayers: function (props) {
        var bb = props.tile.boundingBox;
        var bounds = bb
          ? [bb[0][0], bb[0][1], bb[1][0], bb[1][1]]
          : [props.tile.bbox.west, props.tile.bbox.south,
             props.tile.bbox.east, props.tile.bbox.north];
        return new deck.BitmapLayer({ id: props.id + "-bmp", image: props.data,
                                      bounds: bounds });
      }
    });
  }
  var _charSet = null;
  function charSet() {
    if (!_charSet) {
      var s = ORIENT.labels.features.map(function (f) { return f.properties.name; })
        .join("") + "0123456789 ";
      _charSet = Array.from(new Set(Array.from(s)));
    }
    return _charSet;
  }
  function boroughLabels() {
    return new deck.TextLayer({
      id: "borough-labels", data: ORIENT.labels.features,
      getPosition: function (f) { return f.geometry.coordinates; },
      getText: function (f) { return f.properties.name; },
      getSize: 11.5, getColor: [186, 198, 212, 225],
      fontFamily: "DM Sans, sans-serif", fontWeight: 600,
      characterSet: charSet(), fontSettings: { sdf: true },
      outlineWidth: 2.5, outlineColor: [26, 35, 50, 230],
      billboard: true, parameters: { depthTest: false },
      extensions: [new deck.CollisionFilterExtension()],
      collisionEnabled: true, collisionGroup: "labels",
      // REQUIRED, even though every label shares the same value: without an
      // explicit getCollisionPriority the extension culls all 33 labels and the
      // map loses its only orientation cues. Omitting it fails silently — no
      // console error, no warning, just no text.
      getCollisionPriority: 100,
      collisionTestProps: { sizeScale: 2.6 }
    });
  }

  // Extrusion heights are in METRES, so a value that reads as a skyline across
  // the whole of London becomes a kilometre-high wall once you zoom into a
  // borough — the visible ground shrinks but the bars do not. Deck's zoom is
  // log2, so halving the height per zoom level holds the apparent height
  // steady against the ground extent. Capped at 1 so zooming out never
  // stretches bars beyond the height each measure was tuned for.
  //
  // This is elevationScale, a layer prop, so it costs nothing: the colour and
  // elevation buffers are untouched.
  function elevScale(z) {
    return Math.min(1, Math.pow(2, CAMERA.zoom - z));
  }
  var curElevScale = 1;

  function polyLayer(T, visible) {
    var m = MEASURE_BY_KEY[measureKey];
    return new deck.SolidPolygonLayer({
      id: "poly-" + T.key,
      visible: visible,
      elevationScale: curElevScale,
      // Semi-transparent over the basemap so the streets read underneath;
      // opaque on ink, where there is nothing to see through and transparency
      // would only mute the data.
      opacity: CFG.polyOpacity[mode],
      data: {
        length: T.header.nRings,
        startIndices: T.ringStart,
        attributes: {
          getPolygon: { value: T.pos, size: 2 },
          getFillColor: { value: T.col, size: 4, normalized: true },
          getElevation: { value: T.elev, size: 1 }
        }
      },
      _normalize: false,          // rings are pre-closed and pre-wound at build time
      positionFormat: "XY",
      extruded: true, filled: true, wireframe: false, pickable: true,
      material: { ambient: 0.5, diffuse: 0.65, shininess: 20,
                  specularColor: [40, 52, 68] },
      updateTriggers: {
        getFillColor: T.key + ":" + m.key,
        getElevation: T.key + ":" + m.key
      },
      transitions: TRANSITION ? {
        getFillColor: { duration: TRANSITION, easing: easeCubicInOut },
        getElevation: { duration: TRANSITION, easing: easeCubicInOut }
      } : {}
    });
  }

  function layers() {
    // The Thames polygon and the borough labels are redundant over the street
    // map, which draws both far better than we can.
    var stack = mode === "street" ? [basemapLayer()] : [thamesLayer()];
    if (areasShow) {
      ["lsoa", "oa"].forEach(function (t) {
        var T = READY[t];
        if (T && T.painted) stack.push(polyLayer(T, t === tier));
      });
    }
    stack.push(boroughCasing(), boroughLayer());   // over the extrusions, not under
    if (mode !== "street") stack.push(boroughLabels());
    return stack;
  }

  var READY = {};        // resolved tiers, by key

  // ---- tooltip ------------------------------------------------------------
  function codeOf(T, f) {
    var L = T.labels;
    var n = String(L.codeNums[f]);
    while (n.length < L.codeWidth) n = "0" + n;
    return L.codePrefix + n;
  }
  function placeName(T, f) {
    var L = T.labels;
    var borough = L.ladNames[L.lad[f]];
    if (L.names) return L.names[f] + ", " + borough;
    return borough;
  }

  function tooltip(info) {
    var T = READY[tier];
    if (!T || info.index === undefined || info.index < 0) return null;
    if (!info.layer || info.layer.id !== "poly-" + tier) return null;
    var f = T.featureOf[info.index];
    var m = MEASURE_BY_KEY[measureKey];
    var vals = CURRENT_VALS;
    if (!vals) return null;

    var html = '<div class="tt">';
    html += '<div class="tt-where">' + placeName(T, f) + " · " + codeOf(T, f) + "</div>";

    if (suppressed(f, m, T)) {
      var b = Math.round(T.base[m.denom][f]);
      html += "<div>Not shown — only <b>" + b + "</b> " +
              denomLabel(m.denom) + " here, too few to give a reliable figure.</div>";
    } else {
      var v = shownValue(f, m, vals, T.base);
      if (v === null) {
        html += "<div>No figure available here.</div>";
      } else {
        html += "<div><b>" + fmt(v, m.fmt) + "</b> " + m.unit + "</div>";
        if (m.kind === "count") {
          html += "<div class=\"tt-where\">" +
                  Math.round(vals[f]).toLocaleString("en-GB") + " of " +
                  Math.round(T.base[m.denom][f]).toLocaleString("en-GB") + " " +
                  denomLabel(m.denom) + "</div>";
        }
      }
    }
    // Standing caveats that would otherwise silently mislead.
    var res = T.base.residents[f], ce = T.base.ceres[f];
    if (res > 0 && ce / res > 0.5) {
      html += '<div class="tt-note">Mostly a communal establishment — halls, ' +
              "a care home or similar.</div>";
    }
    if (T.labels.ladNames[T.labels.lad[f]] === "City of London") {
      html += '<div class="tt-note">The City has few residents but around 600,000 ' +
              "weekday workers; residential figures describe almost nobody who is " +
              "here in the daytime.</div>";
    }
    html += "</div>";
    return {
      html: html,
      style: {
        background: "rgba(36,49,66,0.96)", color: "#F3F6F4",
        border: "1px solid #3B4A5E", borderRadius: "6px", padding: "9px 12px",
        fontFamily: "'DM Sans', sans-serif", fontSize: "12px", maxWidth: "290px"
      }
    };
  }
  function denomLabel(k) {
    for (var i = 0; i < MANIFEST.denominators.length; i++)
      if (MANIFEST.denominators[i].key === k) return MANIFEST.denominators[i].label;
    return k;
  }

  // ---- chrome -------------------------------------------------------------
  var titleEl = document.getElementById("title");
  var subEl = document.getElementById("subtitle");
  var loadEl = document.getElementById("loading");
  var modebar = document.getElementById("modebar");
  var groupbar = document.getElementById("groupbar");
  var switcher = document.getElementById("switcher");
  var resetBtn = document.getElementById("reset");
  var hintEl = document.getElementById("hint");

  var loadTimer = null;
  function showLoading(on) {
    if (on) {
      if (loadTimer) return;
      // Only after 250 ms — a cached switch resolves in single-digit
      // milliseconds and a bar that flashes on every click reads as breakage.
      loadTimer = setTimeout(function () { loadEl.classList.add("on"); }, 250);
    } else {
      clearTimeout(loadTimer); loadTimer = null;
      loadEl.classList.remove("on");
    }
  }

  function setText() {
    var m = MEASURE_BY_KEY[measureKey];
    var spec = MANIFEST.tiers[tier];
    titleEl.textContent = m.label;
    var bits = [];
    if (m.note) bits.push(m.note);
    bits.push("Shown across " + spec.n.toLocaleString("en-GB") + " " +
              spec.labelPlural + (tier === "lsoa" ? " — zoom in for output areas." : "."));
    subEl.textContent = bits.join(" ");
  }

  function renderLegend() {
    var m = MEASURE_BY_KEY[measureKey];
    var lg = document.getElementById("legend");
    var ramp = m.diverging ? MANIFEST.rampDiverging : MANIFEST.ramp;
    document.getElementById("lgTitle").textContent = m.label + " — " + m.unit;
    document.getElementById("lgBar").style.background =
      "linear-gradient(to right," + ramp.join(",") + ")";
    document.getElementById("lgZero").style.display = m.diverging ? "block" : "none";
    document.getElementById("lgTicks").innerHTML = m.breaks.map(function (b, i) {
      var s = fmt(b, m.fmt);
      // Values beyond the domain clip to the end colour, so say so rather than
      // implying the scale stops there.
      if (i === m.breaks.length - 1 && !m.diverging) s += "+";
      return "<span>" + s + "</span>";
    }).join("");
    var dirs = document.getElementById("lgDirs");
    if (m.diverging && m.divLow) {
      dirs.style.display = "flex";
      dirs.innerHTML = "<span>← " + m.divLow + "</span><span>" +
                       m.divHigh + " →</span>";
    } else {
      dirs.style.display = "none";
    }
    document.getElementById("lgNd").style.background =
      "rgb(" + NODATA_COLOR.slice(0, 3).join(",") + ")";
    lg.style.visibility = "visible";
  }

  function updateChrome() {
    // The Thames and borough outlines are ONS/OS in both modes, so that credit
    // stands whether or not the CARTO basemap is switched on.
    var credits = [CFG.attribution,
                   mode === "street" ? CFG.basemap.attribution : ""];
    document.getElementById("attrib").textContent =
      credits.filter(Boolean).join(" · ");
    document.body.classList.toggle("light-base", mode === "street");
    document.getElementById("mapbtn").textContent =
      "Map: " + (mode === "street" ? "Street" : "Boroughs");
    document.getElementById("areabtn").textContent =
      "Areas: " + (areasShow ? "show" : "hide");
  }

  function setMode(m) {
    mode = m === "street" ? "street" : "boroughs";
    deckgl.setProps({ layers: layers() });
    updateChrome();
  }
  function setAreas(show) {
    areasShow = !!show;
    deckgl.setProps({ layers: layers() });
    updateChrome();
  }

  function buildModeBar() {
    var mapBtn = document.createElement("button");
    mapBtn.id = "mapbtn";
    mapBtn.title = "Switch between borough outlines on ink and an OpenStreetMap "
                 + "street map (loads map tiles from CARTO)";
    mapBtn.addEventListener("click", function () {
      setMode(mode === "street" ? "boroughs" : "street");
    });
    modebar.appendChild(mapBtn);

    var areaBtn = document.createElement("button");
    areaBtn.id = "areabtn";
    areaBtn.title = "Hide the extruded areas to see the map underneath";
    areaBtn.addEventListener("click", function () { setAreas(!areasShow); });
    modebar.appendChild(areaBtn);
  }

  function buildGroupBar() {
    groupbar.innerHTML = "";
    MANIFEST.groups.forEach(function (g) {
      var b = document.createElement("button");
      b.textContent = g.label;
      b.dataset.group = g.key;
      b.title = g.blurb;
      if (g.key === groupKey) b.classList.add("active");
      b.addEventListener("click", function () { setGroup(g.key); });
      groupbar.appendChild(b);
    });
  }

  function buildSwitcher() {
    switcher.innerHTML = "";
    measuresIn(groupKey).forEach(function (m) {
      var b = document.createElement("button");
      b.textContent = m.short || m.label;
      b.dataset.key = m.key;
      b.title = m.label + (m.unit ? " (" + m.unit + ")" : "");
      if (m.key === measureKey) b.classList.add("active");
      b.addEventListener("click", function () { setMeasure(m.key); });
      switcher.appendChild(b);
    });
  }
  function markActive() {
    var bs = switcher.querySelectorAll("button");
    for (var i = 0; i < bs.length; i++)
      bs[i].classList.toggle("active", bs[i].dataset.key === measureKey);
    var gs = groupbar.querySelectorAll("button");
    for (var j = 0; j < gs.length; j++)
      gs[j].classList.toggle("active", gs[j].dataset.group === groupKey);
  }
  function markPending(key, on) {
    var bs = switcher.querySelectorAll("button");
    for (var i = 0; i < bs.length; i++)
      if (bs[i].dataset.key === key) bs[i].classList.toggle("pending", on);
  }

  // ---- state transitions --------------------------------------------------
  var CURRENT_VALS = null;

  function apply() {
    var m = MEASURE_BY_KEY[measureKey];
    window.__NG_DONE__ = false;
    markPending(measureKey, true);
    showLoading(true);
    return Promise.all([loadTier(tier), loadGroup(tier, groupKey)])
      .then(function (r) {
        var T = r[0], slots = r[1];
        READY[tier] = T;
        CURRENT_VALS = slots[measureKey];
        paint(T, CURRENT_VALS, m);
        // Clear the frame flag HERE, immediately before the setProps whose
        // render we are waiting on — not at the top of apply(). Clearing it
        // early lets an unrelated earlier render satisfy it, which is how the
        // screenshot driver ends up photographing the previous measure.
        notDone();
        deckgl.setProps({ layers: layers() });
        setText(); renderLegend(); markActive();
        markPending(measureKey, false); showLoading(false);
      })
      .catch(function (err) {
        markPending(measureKey, false); showLoading(false);
        window.__NG_ERROR__ = String(err && err.message || err);
        titleEl.textContent = "Could not load the map data";
        subEl.textContent = String(err && err.message || err);
        throw err;
      });
  }

  function setGroup(g) {
    if (g === groupKey) return Promise.resolve();
    groupKey = g;
    // Never leave the map showing a measure from a group you are not on.
    measureKey = measuresIn(g)[0].key;
    buildSwitcher(); markActive();
    return apply();
  }
  function setMeasure(k) {
    if (k === measureKey) return Promise.resolve();
    measureKey = k;
    markActive();
    titleEl.style.opacity = subEl.style.opacity = 0;
    setTimeout(function () {
      titleEl.style.opacity = subEl.style.opacity = 1;
    }, 220);
    return apply();
  }
  function setTier(t) {
    if (t === tier) return Promise.resolve();
    tier = t;
    return apply();
  }

  // ---- zoom-driven tier switch -------------------------------------------
  var Z = MANIFEST.zoom;
  function targetTier(z) { return z < Z.switch ? "lsoa" : "oa"; }
  var prefetched = false;
  function maybePrefetch(z) {
    // A full zoom band before the switch, start pulling OA in the background so
    // crossing the threshold is a visibility flip and not a download.
    if (prefetched || z < Z.prefetch) return;
    prefetched = true;
    loadTier("oa").then(function (T) { READY.oa = T; }).catch(function () {});
    loadGroup("oa", groupKey).catch(function () {});
  }
  function applyZoom(z) {
    maybePrefetch(z);
    // Only rebuild when the change is visible — this fires on every frame of a
    // zoom gesture, and a setProps per frame for a 2% height change is waste.
    var s = elevScale(z);
    if (Math.abs(s - curElevScale) / curElevScale > 0.04) {
      curElevScale = s;
      if (READY[tier] && READY[tier].painted) deckgl.setProps({ layers: layers() });
    }
    if (pinnedTier) return;
    var t = targetTier(z);
    if (t !== tier && Math.abs(z - Z.switch) > Z.hysteresis) setTier(t);
  }

  // ---- deck ---------------------------------------------------------------
  var zoomAdj = Math.min(0, Math.log2(window.innerWidth / CFG.baseWidth));
  var CAMERA = Object.assign({}, CFG.camera, { zoom: CFG.camera.zoom + zoomAdj });

  var framed = false;
  var deckgl = new deck.DeckGL({
    container: "map",
    initialViewState: CAMERA,
    controller: { dragMode: "rotate", touchRotate: true, inertia: 250 },
    layers: [thamesLayer(), boroughLayer()],
    effects: [lighting],
    getTooltip: tooltip,
    onViewStateChange: function (e) { applyZoom(e.viewState.zoom); },
    // Unconditional, not guarded on !framed: with the guard, the very first
    // render (before any data has arrived) consumes the transition and no
    // later render can ever re-arm it.
    onAfterRender: function () { framed = true; settle(); }
  });

  document.getElementById("map").addEventListener("contextmenu", function (e) {
    e.preventDefault();
  });
  document.getElementById("map").addEventListener("pointerdown", function () {
    resetBtn.style.display = "block";
  });
  var nudge = 0;
  resetBtn.addEventListener("click", function () {
    nudge += 1e-6;
    deckgl.setProps({
      initialViewState: Object.assign({}, CAMERA, {
        bearing: CAMERA.bearing + nudge, transitionDuration: 900
      })
    });
    // Programmatic camera moves bypass onViewStateChange, so the tier has to be
    // re-synced by hand. Same lesson, same fix as the Yorkshire build.
    applyZoom(CAMERA.zoom);
  });

  // The shield is for iframe embeds, where a scroll over the map would
  // otherwise be swallowed. ?shield=0 turns it off for the screenshot driver,
  // which would otherwise photograph the "click to explore" prompt.
  if (CFG.shield && params.get("shield") !== "0") {
    var shield = document.getElementById("shield");
    var mapEl = document.getElementById("map");
    mapEl.style.pointerEvents = "none";
    shield.style.display = "flex";
    shield.addEventListener("click", function () {
      shield.style.display = "none";
      mapEl.style.pointerEvents = "auto";
    });
  }

  // ---- capture hooks ------------------------------------------------------
  // __NG_DONE__ must mean "everything requested is resident, painted and on
  // screen", or the screenshot driver photographs a half-loaded map.
  var fontsReady = false;
  var settling = false;
  function notDone() { framed = false; settling = false; window.__NG_DONE__ = false; }
  function settle() {
    if (window.__NG_DONE__ || settling) return;
    if (inflight !== 0 || !framed || !fontsReady || !CURRENT_VALS) return;
    settling = true;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        settling = false;
        if (inflight === 0 && framed && fontsReady && CURRENT_VALS) {
          window.__NG_DONE__ = true;
        }
      });
    });
  }
  window.__NG_DONE__ = false;
  window.__NG_MANIFEST = MANIFEST;
  window.__setGroup = setGroup;
  window.__setMeasure = function (k) {
    var m = MEASURE_BY_KEY[k];
    if (!m) return Promise.reject(new Error("unknown measure " + k));
    if (m.group !== groupKey) { groupKey = m.group; buildSwitcher(); }
    measureKey = k; markActive();
    return apply();
  };
  window.__setTier = function (t) { pinnedTier = t; tier = t; return apply(); };
  window.__setMode = setMode;
  window.__setAreas = setAreas;
  window.__applyZoom = applyZoom;

  // ---- boot ---------------------------------------------------------------
  buildModeBar();
  buildGroupBar();
  buildSwitcher();
  updateChrome();
  setText();
  apply();

  // Idle prefetch: if nobody has zoomed after a few seconds, pull the output
  // area tier anyway so the first zoom is instant.
  setTimeout(function () { maybePrefetch(Z.prefetch); }, 3500);

  Promise.all([
    document.fonts.load("700 16px 'Libre Baskerville'"),
    document.fonts.load("400 16px 'DM Sans'"),
    document.fonts.load("600 16px 'DM Sans'"),
    document.fonts.load("700 16px 'DM Sans'")
  ]).then(function () { return document.fonts.ready; })
    .then(function () { fontsReady = true; settle(); })
    .catch(function (err) { window.__NG_ERROR__ = "font load failed: " + String(err); });
  </script>
</body>
</html>
